/* ---------------- CHAPTER 8: Kiddush HaChaim ---------------- */
LESSONS['c8-t1'] = {
  story: [
    `**The starting point.** The Germans' goal was to **exterminate** the Jews – but also to **crush their spirit and humiliate them**. They denied basic living conditions, broke up families and degraded Jewish identity. So the Jews' response was a fight on two fronts: for **life itself** (trying to survive the war) and for **the meaning of life and צלם אנוש** ({צלם אנוש} = "the image of man" – human dignity, staying human).`,
    `**Kiddush Hashem in history ({קידוש ה'}).** "Sanctifying God's name". Throughout history, when Jew-haters wanted to kill Jews, the Jews were often given a choice: **break God's commandments (e.g. convert) or die**. And the Jews chose **to die for Kiddush Hashem** – martyrdom.`,
    `**Why the Holocaust was different.** In the Holocaust the Jew **wasn't asked to convert** – converting wouldn't save him. The Germans' goal was to **destroy the Jews themselves**, not only Judaism. So there was no "choice" to make with one's death; instead the Jews wanted **to sanctify life** – to keep living at any price (within morality, see below).`,
    `**The halachic question.** Jewish law distinguishes: in a **"time of shmad"** ({שעת השמד} – a period when Jews are persecuted *for keeping mitzvot*), a Jew must give his life even for a small mitzva. But normally, **saving a life – {פיקוח נפש} – overrides almost all mitzvot**. So rabbis asked: **is the Holocaust a time of shmad?** If yes, Jews must die rather than break mitzvot; if not, they may break mitzvot to survive.`,
    `**The ruling: Rabbi Nissenbaum (Warsaw ghetto) and most poskim** ({פוסקים} = halachic decisors): the Holocaust is **not** a time of shmad – the opposite. For the first time the enemy persecutes the Jew **not for keeping the Torah, but because he wants to destroy the Jewish body**. Therefore the Jew must **guard his life and do everything to survive**. His famous words: **"This is an hour of Kiddush HaChaim and not of Kiddush Hashem by death. In the past the enemies demanded the soul, and the Jew sacrificed his body. Now the oppressor demands the body, and the Jew must defend it: guard his life."** (Booklet p.41 writes "הרב חיים ניסנבוים"; his name was **Yitzhak**.)`,
    `**The two meanings of Kiddush HaChaim (memorize – asked constantly):** (1) **Sanctifying life itself** ({קידוש עצם החיים}) – in Yiddish **"iberlebn"** (איבערלייבן = to survive): fighting for and protecting life as much as possible, saving your own life and others'. Examples: **smuggling food**, **hiding** in non-Jews' homes and **monasteries**, **posing as non-Jews** (false papers), **fleeing to the forests**. (2) **Sanctifying the way of life** ({קידוש דרך החיים}) – keeping **צלם אנוש**: continuing to be a human, moral person with values; keeping human dignity; **helping others**; a life with **meaning**, including religious meaning by keeping Torah and mitzvot – all inside an inhuman reality. Examples: **orphanages and soup kitchens**, keeping a **Jewish way of life**.`,
    `**What Kiddush HaChaim is NOT.** It does **not** mean survival at any price. It **does not allow saving yourself at someone else's expense**, nor sins that are forbidden in every situation. The ghetto created **daily moral dilemmas** that could decide life or death, and a person had to stay true to his conscience. The booklet's examples: **May you steal food from neighbors when you're starving? May you hide a family member's death to keep receiving his food ration, even if it hurts others' rations?** Kiddush HaChaim means facing these choices *morally*.`,
    `**The booklet's map of coping (p.42)** – three branches: **leadership** (Judenrats, rabbis – chapter 9), **Kiddush HaChaim** (education, culture, aid and welfare, keeping Torah and mitzvot – responsa – topics 8.2-8.3), and **resistance** (escape and hiding, partisans, revolts – 9.4).`
  ],
  remember: [
    `Nazis wanted to destroy the body AND crush the spirit → fight for life + צלם אנוש.`,
    `History: Kiddush Hashem = die rather than transgress. Holocaust: no conversion option → sanctify life.`,
    `Not a "time of shmad" (Nissenbaum + most poskim) → פיקוח נפש.`,
    `Two meanings: life itself (iberlebn – smuggling, hiding, fleeing) + way of life (צלם אנוש – helping, orphanages, Jewish life).`,
    `Not at any price: never at another's expense.`
  ],
  exam: [
    `Booklet p.44 Q2, p.51 Q4-Q5. Always quote Nissenbaum, give the two meanings, and explain the "newness": the enemy wants the body, not the soul.`
  ]
};

LESSONS['c8-t2'] = {
  story: [
    `**"Jewish standing" ({עמידה יהודית}).** This is the term for **unarmed resistance** – staying human and giving life meaning as a way of standing up to the Nazis. Kiddush HaChaim wasn't only about staying alive, but about a **life with meaning**, spirit and culture, even in the daily struggle to survive.`,
    `**(א) Aid and welfare ({עזרה וסעד}).** Examples: **hospitals, orphanages, soup kitchens ({בתי תמחוי})** and the **chevra kadisha** (burial society). The Jews proved that even then **they cared for each other**. The aid demanded self-sacrifice from the givers, who exposed themselves to disease and gave their last strength. **Three kinds of aid (memorize):** (1) **organized aid from outside the ghetto** – e.g. **the Joint** (the American Jewish aid organization), which brought some equipment and food while it could (until the USA entered the war); (2) **organized aid from inside the ghetto** – e.g. **{היס"א}** (the Jewish organization for mutual social aid / Jewish Self-Help), **house committees** ({ועדי בתים}) in Warsaw that helped hundreds of families living in each building, and **public kitchens** that gave out a bowl of soup and a slice of bread; (3) **personal acts of humanity and compassion** between individual Jews – giving your **last piece of bread to a friend dying of hunger**, caring for a sick person, sometimes at the risk of your own life.`,
    `**What was the value of aid, if it didn't save them?** The booklet is honest: all this help **couldn't solve** the ghetto's problems and **didn't save** the Jews from death. So what was it worth? The booklet's answer is a quote: **"אם אתה מפסיק לתת, אתה מפסיק לחיות – אתה סתם קיים"** – "If you stop giving, you stop living – you merely exist." Giving kept people **human** – that's Kiddush HaChaim of the way of life.`,
    `**(ב) Education ({חינוך בגטו}).** The Holocaust took the children's childhood and forced them to grow up fast and take responsibility for their families. In the ghettos of the **General Government, studying in schools was forbidden** – and precisely there Jews kept educating their children. Despite the danger of breaking Nazi orders, **underground** schools were set up; children came **hungry and frozen** to learn. There were **elementary and high schools, vocational courses, Torah study frameworks and youth movements**. Why risk death for school? Because learning means believing in a **future**.`,
    `**(ג) Culture ({תרבות בגטו}).** Even in the hardest days the Jews kept a rich cultural life: **newspapers, songs, plays and performances, choirs, a public library**. Many artists had no skills to survive ghetto life, so **Judenrat members started cultural activities and paid the artists**. Culture helped in **two ways**: (1) it helped **the artists survive** and gave them encouragement and meaning; (2) it helped **all the ghetto's Jews keep their צלם אנוש** – Kiddush HaChaim. **The example: the Vilna ghetto** had a **theater that put on over 100 shows a year** and a **library used by a quarter of the ghetto's population**.`,
    `**Jewish spirit.** There was an effort to keep Jewish culture: **Hebrew lessons**, plays about events in **Jewish history**, celebrating **Jewish holidays** – another way to fight the Germans, who wanted to crush the Jewish spirit.`,
    `**The culture dilemma.** Was it right to hold plays and concerts **where people were dying of hunger in the street**? Some said **"you don't hold a concert in a cemetery"**. On the other hand, culture **encouraged people, gave hope and meaning** to their hard lives. The booklet's conclusion: **in the eyes of the ghetto Jews it was a kind of victory and Jewish resistance.**`
  ],
  remember: [
    `Aid – 3 kinds: outside (Joint), inside (היס"א, house committees, kitchens), personal kindness. "If you stop giving..."`,
    `Education banned in the General Government → underground schools, courses, Torah, youth movements.`,
    `Culture – 2 ways it helped; Vilna theater 100+ shows/year, library ¼ of ghetto; the "concert in a cemetery" dilemma.`
  ],
  exam: [
    `Booklet p.51 Q5: is Kiddush HaChaim resistance? → yes: Nazis wanted to crush the spirit; examples: underground schools, Vilna theater, keeping mitzvot.`
  ]
};

LESSONS['c8-t3'] = {
  story: [
    `**Religious life ({חיי הדת}).** As part of their war on the Jews, the Germans also restricted religion: in many places they banned **public prayer, brit mila and Jewish holidays**. Precisely because of that, keeping a Jewish way of life became a way to **fight the German enemy**. Many kept mitzvot despite every ban and despite the risk to their lives.`,
    `**Responsa ({שו"ת} = שאלות ותשובות, questions and answers).** Just as before the Holocaust, Jews asked rabbis halachic questions and got answers. The harsh reality raised **terrible new questions** – and the very fact that people asked shows their huge **self-sacrifice**: they wanted to keep the mitzvot even there.`,
    `**Why ruling was so hard for the rabbis (3 reasons – memorize):** (1) **no books of halacha** in the ghetto – they had to rule from memory; (2) **no one to consult** – most rabbis were sent first to their death (the Germans targeted leaders), and some managed to flee; (3) **an answer was needed fast**, and they didn't always know what to say. For the **first time** they had to rule on **matters of life and death** ({דיני נפשות}) in a reality they had never known.`,
    `**The booklet's example of a responsum.** The question was sent to **Rabbi Ephraim Oshry in Kovno** and to **Rabbi Aharonson**, who was deported to the **Konin** camp: **may Jewish forced laborers eat non-kosher food (treif soup)?** The problem: there was no immediate danger, but there was a risk the body would **weaken** and only after some days reach a life-threatening state. In halacha this is called **"פיקוח נפש שלאחר זמן"** – a danger to life that comes later. **The answer: it is permitted to eat the treif soup because of פיקוח נפש** – even though there's no real danger at that moment, since they'd weaken and come into danger later. This shows Kiddush HaChaim in halacha: **life comes first**.`,
    `**Kiddush Hashem still existed.** By halacha (as the great rabbis ruled) Jews in the Holocaust were **not obligated** to give their lives for keeping Torah and mitzvot. **Even so, some Jews preferred to die rather than cut off their peyot or give up praying with a minyan.** Know this as an example of Kiddush Hashem *during* the Holocaust.`,
    `**More responsa: may one eat chametz on Pesach? May a boy put on tefillin before bar mitzva age, since it's unknown if he'll live to 13? The answer to both: yes, permitted.** (The teacher's slides add the tragic end of the tefillin story: the boy was taken in the Kovno ghetto children's aktion.)`,
    `**The photo question (p.44-45).** Two photos: a **classroom in the Łódź ghetto** and a **children's public kitchen in the Warsaw ghetto**. How each relates to Kiddush HaChaim: the **classroom** = sanctifying the *way* of life – education, normal routine, hope for the future, done secretly against the Nazi ban; the **kitchen** = sanctifying *life itself* (keeping children alive) **and** the way of life (mutual help, צלם אנוש).`

/* ---------------- CHAPTER 9: Leadership and resistance ---------------- */
LESSONS['c9-t1'] = {
  story: [
    `**The leadership vacuum.** When the Nazis invaded Poland, **many community leaders fled**, thinking the Germans would harm leaders first. So many communities were left **without leaders** at the worst possible time.`,
    `**What was the Judenrat ({יודנראט})?** "Judenrat" = "Jewish council"; in Hebrew {מועצת זקנים יהודית} – a council of Jewish elders. The order to set it up was in the **Schnellbrief** (1939). It was created **by German order**, but its members were often **chosen by the community**, so it became the **real leadership** of the ghetto – the people who actually ran it. **Its purpose (booklet): the machinery for carrying out German orders, and the link between the Jews and the authorities.**`,
    `**Why did the Nazis want Judenrats? (booklet answer, p.51)** (1) To get help **carrying out their orders**, which **saved German manpower**; (2) to **avoid contact** with the Jews; (3) to give the Jews a **feeling that they run themselves** – "Jewish autonomy". (That's the "illusion of autonomy" from the ghetto goals.)`,
    `**The two sets of roles (the booklet's worksheet).** **Toward the Nazis:** carry out their orders – supply workers for **forced labor**, collect property/taxes, enforce the **marking** (armband/patch), and later prepare **deportation lists**. **Toward the ghetto residents:** organize life – **food, housing, health, welfare, education and culture** (e.g. paying the artists). This double role is the heart of every dilemma.`,
    `**Control by the Germans.** The Germans **frequently replaced** Judenrat heads who were "too independent" and appointed obedient ones. Judenrat heads could hardly consult or share information with other communities, so each acted by his own understanding – and the **lack of information and German deception** created great confusion.`,
    `**The first dilemma: accept the appointment or not?** The very existence of the Judenrat contains a **huge tension**: on one side the need to **obey the Germans** and fill the official role; on the other, the wish to **protect the Jews** and their physical and spiritual life. Judenrats were appointed **before** the ghettos, when nobody knew what the Nazis would demand or what their real goals were. The Germans preferred leaders the Jews would accept (so people would obey), so sometimes the community chose – but when the choice didn't fit Nazi goals, the Nazis appointed whoever they wanted. **Motives for accepting:** some wanted to **help the community**; others wanted **honor, power and benefits**. Some **refused**, and some accepted out of a **sense of responsibility**.`,
    `**First wave vs. second wave (a typical comparison).** **First wave** – heads appointed right after the conquest of Poland: they felt **more committed to the Jewish public**, which is why **more of them were removed** for not obeying. Examples: they helped community members, **refused economic decrees**, **warned of coming aktions**, **refused to hand Jews over** to the Nazis, and some **resigned** because they couldn't accept Nazi policy. **Second wave** – appointed after the first heads were removed: when the Germans wanted full cooperation, they **appointed arbitrarily** people unfit to lead – people who wanted **power and honor**, or who used the ghetto reality for **personal gain**. Many **cooperated** with Nazi orders; some still helped their communities, but **much less** than the first wave.`,
    `**What was the same in both waves: their attitude to revolt.** Both waves **opposed rebellion and the undergrounds**. Why? Most Jews **couldn't believe the Germans were exterminating** the Jewish public; they believed they could **survive the war**, and feared a revolt would **ruin their chances**. So even Judenrat heads who were truly committed to the Jews believed revolt **did not serve the Jews' goals**.`,
    `**Daily dilemmas until the deportations.** Judenrat heads struggled to find a place between cooperating and keeping the ghetto alive. Examples from the booklet: the Germans demanded forced laborers – **obey? send people who won't come back?** If so, **how to choose – equally, or by physical strength?** **Use money for the common good? Let the rich pay for their lives? Allow food smuggling into the ghetto?** There was **no single answer**, and Judenrat heads were **heavily criticized**.`
  ],
  remember: [
    `Many leaders fled → vacuum. Judenrat = council of elders, by the Schnellbrief; real leadership; carries out orders + link to authorities.`,
    `Why the Nazis wanted it: save manpower, avoid contact, illusion of autonomy.`,
    `Roles: toward Nazis (labor, property, marking, lists) / toward residents (food, housing, health, welfare, culture).`,
    `First dilemma: accept? Motives: help vs power. First wave more loyal; second wave arbitrary and cooperative. Both against revolt.`
  ],
  exam: [
    `Booklet p.51 Q1 (why Judenrats – booklet answer), Q2 (choose a leader).`
  ]
};

LESSONS['c9-t3'] = {
  story: [
    `**Rabbinic leadership ({הנהגה רבנית}).** Throughout history rabbis were a source of strength for the Jewish people – and so in the Holocaust. The booklet says many Jews followed the rabbis' guidance **sometimes even more than the Judenrat's**, and that sometimes **spiritual influence mattered more than physical needs**. When Poland was conquered, the Germans **seized the rabbis first**, seeing them as Jewish leaders. Even so, **many rabbis took responsibility and stayed with their communities**, though they could have fled. They **encouraged** the Jews and **ruled halacha** for them.`,
    `**Who was the Piaseczno Rebbe ({האדמו"ר מפיאסצ'נה})?** Rabbi Kalonymus Kalman Shapira – the rabbi of the town of **Piaseczno** near Warsaw and head of a **Hasidic yeshiva in Warsaw**. ({אדמו"ר} = a title for a Hasidic rebbe.)`,
    `**What he did in the Warsaw ghetto, facing persecution and doubt ({רדיפות ותהיות}):** He **left his home and moved to Warsaw to be near his students**, and **didn't flee even when he could**. The whole time he **encouraged his students**: he kept holding the **"tish"** (טיש – the Hasidic gathering around the rebbe's table, with songs and words of Torah) and gave **sermons that strengthened faith** ({דרשות אמוניות}). He knew that amid hunger and death it was hard to believe, and he spoke about it openly: these are **{ייסורי אמונה}** – "sufferings of faith". His ghetto sermons were **found after the Holocaust** and printed as the book **"אש קודש"** ("Holy Fire").`,

LESSONS['c9-t4'] = {
  story: [
    `**A note first:** booklet pages **49-50** (where this section begins) were **not in your scans**, so the background here comes from your teacher's slides; page 51 is from the booklet.`,
    `**Why so few revolts – and why Warsaw did.** Most Jews didn't believe they were being exterminated, hoped to survive, had no weapons, and feared collective punishment (see the Judenrat attitude, 9.1). In Warsaw that changed after **the Great Deportation – 23 July to 21 September 1942 – when about 300,000 Jews were sent to Treblinka**. The roughly **50,000** who remained understood what "deportation" meant and that the ghetto would soon be liquidated. There was nothing left to lose – so they organized.`,
    `**The two undergrounds – learn the differences.** **{אי"ל}** (ŻOB, the Jewish Fighting Organization) – made up of the **youth movements**: Hashomer Hatzair, Akiva, Dror, and later the Bund; commander **Mordechai Anielewicz**; **short of weapons and military equipment**. **{אצ"י}** (ŻZW, the Jewish Military Union) – founded by the **Betar** movement, led by **Paweł Frenkel** (and Dawid Apfelbaum); **more professional**, with **more weapons and military experience/training** (the edge of booklet p.50 visible in your scan mentions it "managed to collect weapons" and had "military experience"). The two **cooperated only partly**. So the two differences: **who founded/led them** and **how well armed and trained** they were.`,
    `**The uprising.** On **Passover eve (19 April 1943)** about **2,000 German soldiers** entered to liquidate the ghetto and met **hard armed resistance**. (The slides: fighters hit tanks and raised a blue-and-white flag.)`,
    `**Booklet p.51 – how it ended.** The Germans had to **fight for every house** and bring many forces. They realized they had to change method, so they **set the ghetto houses on fire from a distance and pumped gas into the bunkers**, forcing the Jews out. **On 8 May the main bunker fell, and in it the commander, Mordechai Anielewicz.** The fighters kept fighting, and a week later, **on 16 May, the ghetto was liquidated**: **General Stroop** declared **"אין עוד רובע יהודי בוורשה"** – "There is no longer a Jewish quarter in Warsaw" – and as a sign of victory **blew up the Great Synagogue of Warsaw** (which was outside the ghetto).`,
    `**Its significance.** **The revolt lasted a whole month; 16 Nazis were killed and many were wounded. It was the first revolt in all of occupied Europe!** – Jews with almost no weapons held off the German army longer than some countries had (Poland fell in under a month).`,
    `**The difficulties of the organizations at the start (booklet answer, p.51 Q8):** (א) **deciding when to revolt** – too early would bring destruction on everyone, so they waited for the liquidation; (ב) **no contact with the outside world** and **no real help from the Polish undergrounds** (so it was very hard to get weapons); (ג) **some had no military training**; (ד) **part of the Jewish public feared** the revolt would hurt their chance to survive, and **didn't cooperate**.`,
    `**Other armed resistance (from your slides, useful for "two types of resistance"):** **Abba Kovner's** proclamation in the Vilna ghetto (1 January 1942): "**Let us not go like sheep to the slaughter! Better to fall as free fighters than to live by the grace of murderers**"; **partisans** in the forests (over 20,000 Jews), including **Tuvia Bielski's family camp** (over 1,200 people); **camp revolts** in **Treblinka** and **Sobibor** (1943) and the **Sonderkommando revolt in Auschwitz** (1944).`,
    `**Two types of resistance (for p.51 Q7):** **spiritual / unarmed** – Kiddush HaChaim, education, culture, keeping mitzvot (chapter 8); **armed** – ghetto revolts, partisans, camp revolts. If asked "why did Jews choose a certain way": unarmed – most were old people, women and children without weapons who hoped to survive, so keeping life and humanity was the way to fight; armed – after the deportations they knew the truth and chose to die with honor, not "like sheep".`

    `19.4.1943 (Passover eve) → houses burned, gas in bunkers → 8 May Anielewicz falls → 16 May Stroop: "no more Jewish quarter", Great Synagogue blown up.`,

  /* ======================= VIEWS ======================= */
  function vHome() {
    var tot = 0, done = 0;
    STUDY.forEach(function (d) { tot += d.topics.length; done += learnedCount(d); });

    h += '<div class="card note" style="border-left-color:var(--accent);background:var(--accent-soft)"><b style="color:var(--accent)">The test is on your booklet.</b> Work through Chapters 1-9 in order: read each topic (Hebrew from the booklet, English underneath), then do the chapter\'s booklet questions. Booklet pages 1-3, 21, 33 and 49-50 were not in your scans.</div>';

      h += '<h2 style="margin:20px 2px 10px">' + g[1] + '</h2>';

    function dayCard(d) {

      h += '<a class="card daycard' + (isToday ? ' today' : '') + '" href="' + href + '">' +
        '<div class="spread"><span class="num">' + esc(d.label) + ' · ' + esc(d.dayName) + '</span>' + (isToday ? '<span class="chip accent">Today</span>' : '') + '</div>' +
        '<div class="ttl">' + esc(d.title) + '</div>' + he('<span class="muted small">' + esc(d.he) + '</span>');
      if (!d.review) {
        var lc = learnedCount(d);
        h += '<div class="stats"><div class="stat"><span class="tiny muted">Topics learned</span><b>' + lc + ' / ' + d.topics.length + '</b><div class="bar"><i style="width:' + Math.round(100 * lc / d.topics.length) + '%"></i></div></div>' +
          '<div class="stat"><span class="tiny muted">' + (d.group === 'book' ? 'Booklet questions' : 'Bagrut test') + '</span><b>' + (ts.ans ? ts.got + ' / ' + ts.tot : '—') + '</b><span class="tiny muted">' + ts.ans + ' of ' + ts.n + ' answered</span></div></div>';
      } else {
        h += '<div class="stats"><div class="stat"><span class="tiny muted">Timeline + terms</span><b>' + d.timeline.length + ' dates</b></div>' +
          '<div class="stat"><span class="tiny muted">Mock Bagrut</span><b>' + (ts.ans ? ts.got + ' / ' + ts.tot : '—') + '</b><span class="tiny muted">' + ts.ans + ' of ' + ts.n + ' answered</span></div></div>';
      }
      h += '</a>';
    }
    h += '<h2 style="margin:20px 2px 10px">Tools</h2><div class="tools">' +
      tool('#quiz', 'Quick quiz', '10 random questions') + tool('#cards', 'Flashcards', 'Hebrew term → meaning') +
      tool('#weak', 'Weak spots', 'Points you miss most') + tool('#zmrt', 'How to answer', 'זמר"ת + הסבר') +
      tool('#timeline', 'Timeline', 'All key dates') + tool('#terms', 'Key terms', 'Searchable list') + '</div>';
    h += '<div class="card"><h3>Overall</h3><p class="small muted" style="margin:0 0 8px">Topics learned: <b>' + done + ' / ' + tot + '</b> · Bagrut questions answered: <b>' + all.ans + ' / ' + all.n + '</b>' +
      (all.pct !== null ? ' · Average: <b>' + all.pct + '%</b>' : '') + '</p><div class="bar"><i style="width:' + Math.round(100 * done / tot) + '%"></i></div></div>';
    h += '<details class="card"><summary>Settings</summary><div style="margin-top:10px" class="row">' +
      '<button class="btn" data-act="theme">Theme: ' + S.theme + '</button><button class="btn" data-act="size">Text size</button>' +

      '<p class="small muted">Progress is saved on this device only (in this browser). Content lives in the <code>DATA</code> object at the top of index.html.</p></details>';
    return h;
    function tool(href, b, s) { return '<a class="tool" href="' + href + '"><b>' + b + '</b><span>' + esc(s) + '</span></a>'; }
  }

  function vDay(d) {

    var lc = learnedCount(d);
    var h = '<p class="muted small" style="margin:0 2px 4px">' + esc(d.label) + ' · ' + esc(d.dayName) + '</p><h2 style="margin:0 2px 2px">' + esc(d.title) + '</h2>' +
      he('<p class="muted" style="margin:0 2px 12px">' + esc(d.he) + '</p>') + dayTabs(d, 'topics');
    h += '<div class="card"><div class="spread"><b>Topics</b><span class="chip ' + (lc === d.topics.length ? 'ok' : 'accent') + '">' + lc + ' / ' + d.topics.length + ' learned</span></div><div class="tlist">';
    d.topics.forEach(function (t, i) {
      var on = !!S.learned[t.id];
      h += '<a href="#topic--' + t.id + '"><span class="tick' + (on ? ' on' : '') + '">' + (on ? '✓' : (i + 1)) + '</span><span style="flex:1;min-width:0"><b>' + esc(t.title) + '</b>' + he('<span class="small muted">' + esc(t.he) + '</span>') + '</span></a>';

      (ts.ans ? ' Your score so far: <b>' + ts.got + ' / ' + ts.tot + '</b> (' + ts.ans + ' answered).' : '') + '</p><a class="btn primary block" href="#test--' + d.id + '">' + (d.group === 'book' ? 'Answer the booklet questions' : 'Start the Bagrut test') + '</a></div>';
    return h;
  }

  function vReview(d) {
    var ts = testScore(d.bagrut);
    var h = '<p class="muted small" style="margin:0 2px 4px">Thursday</p><h2 style="margin:0 2px 2px">' + esc(d.title) + '</h2>' + he('<p class="muted" style="margin:0 2px 12px">' + esc(d.he) + '</p>') + dayTabs(d, 'over');
    h += '<div class="card"><h3>Thursday plan (about 60-90 min)</h3><ol style="padding-left:20px;margin:6px 0">' +
      '<li><a href="#timeline">Timeline</a>: hide the years and test yourself (15 min).</li>' +
      '<li><a href="#terms">Key terms</a> or <a href="#cards--all">all flashcards</a> (15 min).</li>' +
      '<li><a href="#test--d5">Full mock Bagrut</a>: 6 questions mixing all topics, 100 points (45 min). Write, then check.</li>' +
      '<li><a href="#weak">Weak spots</a>: reread only those topics.</li></ol></div>';
    h += '<div class="card"><div class="spread"><h3 style="margin:0">Mock Bagrut</h3>' + (ts.ans ? '<span class="chip ' + chipFor(ts.pct) + '">' + ts.got + ' / ' + ts.tot + '</span>' : '') + '</div>' +
      '<p class="small muted">New questions mixing everything, including a source question. Or build a random mock from all the booklet questions.</p>' +
      '<div class="row"><a class="btn primary" href="#test--d5">Full mock Bagrut</a><a class="btn" href="#test--random">Random mock</a></div></div>';
    h += '<div class="card"><h3>Your booklet chapters</h3>';
    STUDY.forEach(function (x) { var s = testScore(x.bagrut); h += '<div class="spread" style="padding:6px 0"><a href="#day--' + x.id + '">' + esc(x.label) + ': ' + esc(x.title) + '</a><span class="chip ' + (s.ans ? chipFor(s.pct) : '') + '">' + (s.ans ? s.got + '/' + s.tot : 'not started') + '</span></div>'; });
    h += '</div>';
    return h;
  }

  function lessonHTML(t) {
    var L = t.lesson; if (!L) return '';
    var h = '<div class="tiny muted" style="font-weight:700;letter-spacing:.05em;margin:18px 0 6px">EXPLAINED – THE FULL LESSON</div><div class="lesson">' +
      L.story.map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join('') + '</div>';
    if (L.remember && L.remember.length) h += '<div class="remember"><b>Remember</b><ul>' + L.remember.map(function (r) { return '<li>' + fmt(r) + '</li>'; }).join('') + '</ul></div>';
    if (L.exam && L.exam.length) h += '<div class="examtip"><b>How it\'s asked on the test</b><ul>' + L.exam.map(function (r) { return '<li>' + fmt(r) + '</li>'; }).join('') + '</ul></div>';
    return h;
  }
  function vTopic(id) {
    var o = TOPIC[id]; if (!o) return vNotFound();
    var t = o.t, d = o.day, on = !!S.learned[t.id];
    var prev = d.topics[o.i - 1], next = d.topics[o.i + 1];
    var nq = d.bagrut.filter(function (q) { return q.topic === t.id; }).length;
    var h = '<p class="muted small" style="margin:0 2px 4px"><a href="#day--' + d.id + '">' + esc(d.label) + '</a> · Topic ' + (o.i + 1) + ' of ' + d.topics.length + '</p>' +
      '<h2 style="margin:0 2px 2px">' + esc(t.title) + '</h2>' + he('<p class="muted" style="margin:0 2px 12px;font-weight:600">' + esc(t.he) + '</p>');
    h += '<div class="card"><div class="tiny muted" style="font-weight:700;letter-spacing:.05em;margin-bottom:6px">MAIN IDEA</div><div class="main-idea">' + fmt(t.main) + '</div>' + lessonHTML(t) + (t.lesson ? '</div><div class="card">' : '') +
      (t.items ? '<div class="tiny muted" style="font-weight:700;letter-spacing:.05em;margin:16px 0 6px">FROM THE BOOKLET' + (t.page ? ' · ' + esc(t.page) : '') + ' <span style="font-weight:400">(Hebrew, then English)</span></div>' +
        t.items.map(function (it) { return '<div class="pair"><div class="he-line rtl" dir="rtl" lang="he">' + fmt(it[0]) + '</div><div class="en-line">' + fmt(it[1]) + '</div></div>'; }).join('') : '') +
      (t.facts ? '<div class="tiny muted" style="font-weight:700;letter-spacing:.05em;margin:16px 0 0">KEY FACTS</div><ul class="facts">' + t.facts.map(function (f) { return '<li>' + fmt(f) + '</li>'; }).join('') + '</ul>' : '');
    if (t.note) h += '<div class="note"><b>Note.</b> ' + fmt(t.note.teacher) + '<br><span class="muted">Other version:</span> ' + fmt(t.note.other) + '</div>';
    h += '</div>';
    if (t.test) {
      var shown = UI['t:' + t.id];
      h += '<div class="card"><div class="tiny muted" style="font-weight:700;letter-spacing:.05em;margin-bottom:6px">TEST YOURSELF</div>' + he('<div style="font-weight:700">' + esc(t.test.q) + '</div>') +
        (shown ? '<div class="answer rtl" dir="rtl" lang="he">' + paras(t.test.a) + '</div>' : '<button class="btn reveal" data-act="showTest" data-t="' + t.id + '">Show model answer</button>') + '</div>';
    }
    h += '<label class="learned card"><input type="checkbox" data-act="learn" data-t="' + t.id + '"' + (on ? ' checked' : '') + '> <span><b>Mark as learned</b><br><span class="small muted">I can explain this without looking.</span></span></label>';
    if (nq) h += '<a class="btn block" style="margin-bottom:12px" href="#test--t--' + t.id + '">Practice Bagrut questions on this topic (' + nq + ')</a>';
    h += '<div class="spread">' + (prev ? '<a class="btn" href="#topic--' + prev.id + '">← Previous</a>' : '<span></span>') +
      (next ? '<a class="btn primary" href="#topic--' + next.id + '">Next topic →</a>' : '<a class="btn primary" href="#test--' + d.id + '">Bagrut test →</a>') + '</div>';
    return h;
  }

  /* ---------- Bagrut tests ---------- */
  function testList(which, arg) {
    if (dayById(which)) return { list: dayById(which).bagrut, title: dayById(which).review ? 'Full mock Bagrut' : dayById(which).label + ' Bagrut test', day: dayById(which) };
    if (which === 'weak') return { list: ALLQ.filter(function (q) { var r = S.bq[q.id]; return r && r.pct < 70; }), title: 'Retry weak questions', mixed: true };
    if (which === 't' && TOPIC[arg]) return { list: TOPIC[arg].day.bagrut.filter(function (q) { return q.topic === arg; }), title: 'Practice: ' + TOPIC[arg].t.title, day: TOPIC[arg].day };
    if (which === 'random') {
      if (!S.rmock || !S.rmock.every(function (id) { return QBY[id]; })) newRandomMock();
      return { list: S.rmock.map(function (id) { return QBY[id].q; }), title: 'Random mock Bagrut', mixed: true, random: true, day: REVIEW };
    }
    return null;
  }
  function newRandomMock() {
    // 1 source question (any day) + 6 booklet questions from 6 different chapters
    var all = [];
    NONREV.forEach(function (d) { all = all.concat(d.bagrut); });
    var srcs = shuffle(all.filter(function (q) { return q.src; }));
    var pick = srcs.length ? [srcs[0]] : [];
    shuffle(STUDY).slice(0, 6).forEach(function (d) {
      var c = shuffle(d.bagrut.filter(function (q) { return pick.indexOf(q) < 0; }));
      if (c[0]) pick.push(c[0]);
    });
    S.rmock = pick.map(function (q) { return q.id; }); save();
  }
  function vTest(which, arg) {
    var T = testList(which, arg); if (!T) return vNotFound();
    var h = '';
    if (T.day && (which === T.day.id || which === 'random')) h += dayTabs(T.day, which === 'random' ? 'random' : 'test');
    h += '<h2 style="margin:0 2px 6px">' + esc(T.title) + '</h2>';
    if (!T.list.length) {
      return h + '<div class="card empty">' + (which === 'weak' ? 'No weak questions right now. Questions scoring under 70% show up here.' : 'No questions here yet.') + '</div>';
    }
    h += '<div id="totalBox">' + totalBox(T) + '</div>' + zmrtMini();
    if (T.random) h += '<button class="btn block" style="margin-bottom:14px" data-act="newMock">Build a different random mock</button>';
    T.list.forEach(function (q, i) { h += '<div id="q-' + q.id + '">' + qCard(q, i + 1, T.mixed) + '</div>'; });
    h += '<div class="row" style="justify-content:space-between"><button class="btn ghost" data-act="clearTest" data-w="' + esc(which) + '" data-a="' + esc(arg || '') + '">Clear my answers on this test</button><a class="btn" href="#weak">See weak spots</a></div>';
    app._test = T;
    return h;
  }
  function totalBox(T) {
    var s = testScore(T.list);
    var pct = s.ans ? Math.round(100 * s.got / s.tot) : 0;
    return '<div class="card sticky-total" style="padding:12px 14px"><div class="spread"><span><b>Score: ' + s.got + ' / ' + s.tot + '</b> <span class="small muted">· ' + s.ans + ' of ' + s.n + ' checked</span></span>' +
      (s.ans === s.n ? '<span class="chip ' + chipFor(pct) + '">' + pct + '%</span>' : '') + '</div><div class="bar" style="margin-top:8px"><i style="width:' + Math.round(100 * s.ans / s.n) + '%"></i></div></div>';
  }
  function qCard(q, n, mixed) {
    var r = S.bq[q.id], u = UI[q.id] || {};
    var day = QBY[q.id].day;
    var topic = TOPIC[q.topic];
    var h = '<div class="card">';
    h += '<div class="qtag"><span class="chip accent">Q' + n + ' · ' + q.pts + ' pts</span><span class="chip">' + esc(q.tag) + '</span>' +
      (mixed ? '<span class="chip">' + esc(day.label) + '</span>' : '') + (r ? '<span class="chip ' + chipFor(r.pct) + '">Last: ' + r.got + '/' + q.pts + '</span>' : '') + '</div>';
    if (q.src) h += '<div class="src rtl" dir="rtl" lang="he">' + esc(q.src.text) + (q.src.cite ? '<cite>' + esc(q.src.cite) + '</cite>' : '') + '</div>';
    h += '<div class="qtext rtl" dir="rtl" lang="he">' + esc(q.q) + '</div>';
    h += '<textarea id="ans-' + q.id + '" dir="rtl" lang="he" data-draft="' + q.id + '" placeholder="כתבי כאן את התשובה שלך...">' + esc(S.drafts[q.id] || '') + '</textarea>';
    if (!u.open) {
      h += '<div class="row" style="margin-top:10px"><button class="btn primary" data-act="check" data-q="' + q.id + '">Check</button>' +
        (topic ? '<a class="btn ghost small" href="#topic--' + topic.t.id + '">Review topic</a>' : '') + '</div>';
    } else {
      h += '<div class="model rtl" dir="rtl" lang="he"><div class="tiny muted" style="font-weight:700;margin-bottom:6px">תשובה לדוגמה</div>' + paras(q.model) + '</div>';
      h += '<div class="tiny muted" style="font-weight:700;margin:8px 0 2px">Tick the points your answer included:</div><ul class="keys rtl" dir="rtl" lang="he">';
      q.keys.forEach(function (k, i) {
        var c = u.ticks && u.ticks[i];
        h += '<li><label class="' + (c ? 'on' : '') + '"><input type="checkbox" data-key="' + q.id + '" data-i="' + i + '"' + (c ? ' checked' : '') + (u.scored ? ' disabled' : '') + '><span><span class="kind k-' + esc(k[0]) + '">' + esc(k[0]) + '</span> ' + esc(k[1]) + '</span></label></li>';
      });
      h += '</ul>';
      if (!u.scored) h += '<button class="btn ok block" data-act="score" data-q="' + q.id + '">Score my answer</button>';
      else {
        var p = u.scored.pct;
        h += '<div class="result ' + pctClass(p) + '">' + u.scored.got + ' / ' + q.pts + ' points (' + p + '%)' +
          (p >= 80 ? ' · Great answer.' : p >= 55 ? ' · Good start; add the missing points.' : ' · Reread the topic and try again.') + '</div>' +
          '<div class="row" style="margin-top:10px"><button class="btn" data-act="retry" data-q="' + q.id + '">Try again</button>' + (topic ? '<a class="btn ghost" href="#topic--' + topic.t.id + '">Review topic</a>' : '') + '</div>';
      }
    }
    return h + '</div>';
  }
  function refreshQ(id) {
    var el = document.getElementById('q-' + id);
    if (!el || !app._test) return;
    var T = app._test, i = T.list.indexOf(QBY[id].q);
    el.innerHTML = qCard(QBY[id].q, i + 1, T.mixed);
    var tb = document.getElementById('totalBox'); if (tb) tb.innerHTML = totalBox(T);
  }

  /* ---------- weak spots ---------- */
  function vWeak() {
    var h = '<h2 style="margin:0 2px 6px">Weak spots</h2><p class="muted small" style="margin:0 2px 12px">Built from the key points you did not tick when scoring your Bagrut answers.</p>';
    var answered = ALLQ.filter(function (q) { return S.bq[q.id]; });
    if (!answered.length) return h + '<div class="card empty">Nothing yet. Answer and score a few Bagrut questions first, and your weak spots will show up here.<br><br><a class="btn primary" href="#day--' + (todayDay ? todayDay.id : 'd1') + '">Go to today\'s day</a></div>';
    var weakQ = answered.filter(function (q) { return S.bq[q.id].pct < 70; });
    h += '<div class="card"><div class="spread"><b>Questions under 70%</b><span class="chip ' + (weakQ.length ? 'bad' : 'ok') + '">' + weakQ.length + '</span></div>' +
      (weakQ.length ? '<a class="btn primary block" style="margin-top:10px" href="#test--weak">Retry only these questions</a>' : '<p class="small muted" style="margin:6px 0 0">None. Nice work.</p>') + '</div>';
    // topics
    var tp = {};
    answered.forEach(function (q) { var k = q.topic; tp[k] = tp[k] || { got: 0, tot: 0 }; tp[k].got += S.bq[q.id].got; tp[k].tot += q.pts; });
    var rows = Object.keys(tp).map(function (k) { return { k: k, p: Math.round(100 * tp[k].got / tp[k].tot) }; }).sort(function (a, b) { return a.p - b.p; });
    h += '<div class="card"><h3>Topics by score</h3>';
    rows.forEach(function (r) {
      var t = TOPIC[r.k];
      var name = t ? esc(t.t.title) : 'Mixed (mock)';
      h += '<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="spread">' + (t ? '<a href="#topic--' + r.k + '">' + name + '</a>' : '<span>' + name + '</span>') + '<span class="chip ' + chipFor(r.p) + '">' + r.p + '%</span></div>' +
        '<div class="bar" style="margin-top:6px"><i style="width:' + r.p + '%;background:var(--' + (r.p >= 80 ? 'ok' : r.p >= 55 ? 'warn' : 'bad') + ')"></i></div></div>';
    });
    h += '</div>';
    // key points
    var miss = [];
    Object.keys(S.miss).forEach(function (k) {
      var parts = k.split('#'), o = QBY[parts[0]]; if (!o) return;
      var key = o.q.keys[+parts[1]]; if (!key) return;
      var r = S.bq[parts[0]];
      var stillMissing = r && r.ticks && r.ticks[+parts[1]] === false;
      miss.push({ q: o.q, key: key, n: S.miss[k], still: stillMissing });
    });
    miss.sort(function (a, b) { return (b.still - a.still) || (b.n - a.n); });
    h += '<div class="card"><h3>Points you miss most</h3>';
    if (!miss.length) h += '<p class="small muted">You have ticked every point so far.</p>';
    miss.slice(0, 20).forEach(function (m) {
      var t = TOPIC[m.q.topic];
      h += '<div class="term-row"><div class="spread"><span class="tiny muted">' + (t ? esc(t.t.title) : 'Mock') + '</span><span class="chip ' + (m.still ? 'bad' : 'ok') + '">' + (m.still ? 'missed ×' + m.n : 'fixed (missed ×' + m.n + ')') + '</span></div>' +
        he('<span class="kind k-' + esc(m.key[0]) + '">' + esc(m.key[0]) + '</span> ' + esc(m.key[1])) + '</div>';
    });
    h += '</div>';
    return h;
  }

  /* ---------- flashcards ---------- */
  function deckFor(id) {
    var out = [];
    var src = id === 'all' ? STUDY : [dayById(id)];
    src.forEach(function (d) { if (d) d.flash.forEach(function (c, i) { out.push({ k: d.id + ':' + i, f: c[0], b: c[1], d: d }); }); });
    return out;
  }
  function vCardsPick() {
    var h = '<h2 style="margin:0 2px 10px">Flashcards</h2>';
    STUDY.concat([{ id: 'all', label: 'All booklet chapters', title: 'Every booklet term' }]).concat(EXTRA).forEach(function (d) {
      var deck = deckFor(d.id), known = deck.filter(function (c) { return S.flash[c.k]; }).length;
      h += '<a class="card daycard" href="#cards--' + d.id + '"><div class="spread"><b>' + esc(d.label) + '</b><span class="chip ' + (known === deck.length ? 'ok' : '') + '">' + known + ' / ' + deck.length + ' known</span></div><div class="small muted">' + esc(d.title) + '</div></a>';
    });
    return h;
  }
  function startCards(id, all) {
    var deck = deckFor(id);
    var q = deck.filter(function (c) { return all || !S.flash[c.k]; });
    if (!q.length) q = deck;
    FC = { id: id, deck: deck, queue: shuffle(q), flip: false, done: 0 };
  }
  function vCards(id) {
    if (!id) return vCardsPick();
    if (id !== 'all' && !dayById(id)) return vNotFound();
    if (!FC || FC.id !== id) startCards(id);
    var d = id === 'all' ? REVIEW : dayById(id);
    var known = FC.deck.filter(function (c) { return S.flash[c.k]; }).length;
    var h = dayTabs(d, 'cards') + '<div class="spread" style="margin:0 2px 8px"><b>' + (id === 'all' ? 'All booklet' : esc(d.label)) + ' flashcards</b><span class="chip">' + known + ' / ' + FC.deck.length + ' known</span></div>';
    if (!FC.queue.length) {
      return h + '<div class="card empty"><p style="font-size:1.2em;font-weight:700;color:var(--text)">Deck done.</p><p>You went through every card in this round.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="cardsAll">Go through all cards again</button><button class="btn" data-act="cardsReset">Forget "known" marks</button></div></div>';
    }
    var c = FC.queue[0];
    h += '<div class="flash' + (FC.flip ? ' flip' : '') + '" data-act="flip"><div class="inner">' +
      '<div class="face front"><div class="term rtl" dir="rtl" lang="he">' + esc(c.f) + '</div><div class="tiny muted" style="margin-top:14px">Tap to flip' + (id === 'all' ? ' · ' + esc(c.d.label) : '') + '</div></div>' +
      '<div class="face back"><div class="rtl small muted" dir="rtl" lang="he" style="font-weight:700;margin-bottom:10px">' + esc(c.f) + '</div><div>' + fmt(c.b) + '</div></div></div></div>';
    h += '<div class="row" style="justify-content:space-between"><button class="btn bad" style="flex:1" data-act="again">Again</button><button class="btn ok" style="flex:1" data-act="gotit">Got it</button></div>' +
      '<p class="small muted" style="text-align:center">' + FC.queue.length + ' left in this round</p>';
    return h;
  }

  /* ---------- quiz ---------- */
  function vQuiz(arg) {
    if (!arg) return vQuizSetup();
    var ids = arg === 'all' ? STUDY.map(function (d) { return d.id; }) : arg.split(/[,-]/);
    if (!QZ || QZ.key !== arg) startQuiz(arg, ids);
    if (!QZ.items.length) return '<div class="card empty">No quiz questions for that choice.</div>';
    var d = ids.length === 1 ? dayById(ids[0]) : (arg === 'all' ? REVIEW : null);
    var h = (d ? dayTabs(d, 'quiz') : '');
    if (QZ.i >= QZ.items.length) {
      var pct = Math.round(100 * QZ.score / QZ.items.length);
      h += '<div class="card"><h2>Quiz done: ' + QZ.score + ' / ' + QZ.items.length + '</h2><div class="result ' + pctClass(pct) + '">' + pct + '%</div>';
      var wrong = QZ.items.filter(function (it) { return !it.right; });
      if (wrong.length) {
        h += '<h3 style="margin-top:14px">Review what you missed</h3>';
        wrong.forEach(function (it) { h += '<div class="term-row">' + he('<b>' + esc(it.q.q) + '</b><br><span style="color:var(--ok)">✓ ' + esc(it.q.o[it.q.a]) + '</span>') + '<div class="small muted">' + fmt(it.q.ex) + '</div></div>'; });
      }
      h += '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="quizAgain">New 10 questions</button><a class="btn" href="#quiz">Change days</a></div></div>';
      return h;
    }
    var it = QZ.items[QZ.i];
    h += '<div class="spread" style="margin:0 2px 8px"><span class="chip accent">Question ' + (QZ.i + 1) + ' / ' + QZ.items.length + '</span><span class="chip">Score ' + QZ.score + '</span></div>';
    h += '<div class="card">' + he('<div class="qtext" style="margin-top:0">' + esc(it.q.q) + '</div>');
    it.order.forEach(function (oi) {
      var cls = '';
      if (it.picked !== undefined) { if (oi === it.q.a) cls = ' right'; else if (oi === it.picked) cls = ' wrong'; }
      h += '<button class="opt' + cls + '" lang="he" data-act="pick" data-o="' + oi + '"' + (it.picked !== undefined ? ' disabled' : '') + '>' + esc(it.q.o[oi]) + '</button>';
    });
    if (it.picked !== undefined) {
      h += '<div class="result ' + (it.right ? 'good' : 'low') + '">' + (it.right ? 'Correct!' : 'Not quite.') + '</div><p class="small">' + fmt(it.q.ex) + '</p>' +
        '<button class="btn primary block" data-act="next">' + (QZ.i + 1 < QZ.items.length ? 'Next question' : 'See results') + '</button>';
    }
    return h + '</div>';
  }
  function vQuizSetup() {
    var sel = S.quizSel || STUDY.map(function (d) { return d.id; });
    var h = '<h2 style="margin:0 2px 6px">Quick quiz</h2><p class="muted small" style="margin:0 2px 12px">10 random multiple-choice questions with explanations. Pick the day(s):</p><div class="card"><div class="row">';
    NONREV.forEach(function (d) { h += '<button class="chip' + (sel.indexOf(d.id) >= 0 ? ' sel' : '') + '" data-act="qsel" data-d="' + d.id + '">' + esc(d.label) + ' · ' + d.quiz.length + '</button>'; });
    h += '</div><button class="btn primary block" style="margin-top:14px" data-act="qstart"' + (sel.length ? '' : ' disabled') + '>Start quiz</button></div>';
    if (S.quiz.length) {
      h += '<div class="card"><h3>Recent quizzes</h3>';
      S.quiz.slice(-6).reverse().forEach(function (r) { h += '<div class="spread small" style="padding:4px 0"><span>' + esc(r.days) + '</span><span class="chip ' + chipFor(Math.round(100 * r.s / r.n)) + '">' + r.s + ' / ' + r.n + '</span></div>'; });
      h += '</div>';
    }
    S.quizSel = sel;
    return h;
  }
  function startQuiz(key, ids) {
    var pool = [];
    ids.forEach(function (id) { var d = dayById(id); if (d) pool = pool.concat(d.quiz); });
    QZ = { key: key, ids: ids, i: 0, score: 0, items: shuffle(pool).slice(0, 10).map(function (q) { return { q: q, order: shuffle([0, 1, 2, 3]) }; }) };
  }

  /* ---------- timeline ---------- */
  var CATS = [['bg', 'Background'], ['nazi', 'Nazi Germany'], ['war', 'WWII'], ['final', 'Final Solution'], ['coping', 'Jewish coping'], ['yishuv', 'New Yishuv']];
  function vTimeline() {
    var sel = S.tlCats || CATS.map(function (c) { return c[0]; });
    var h = dayTabs(REVIEW, 'tl') + '<h2 style="margin:0 2px 6px">Timeline</h2><p class="small muted" style="margin:0 2px 10px">Tap an event for details. Turn on "Hide years" to test yourself, then tap to reveal.</p>';
    h += '<div class="card" style="padding:12px"><div class="row">';
    CATS.forEach(function (c) { h += '<button class="chip c-' + c[0] + (sel.indexOf(c[0]) >= 0 ? ' sel' : '') + '" data-act="tlcat" data-c="' + c[0] + '"><span style="width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block"></span>' + c[1] + '</button>'; });
    h += '</div><label class="row" style="margin-top:10px;cursor:pointer"><input type="checkbox" data-act="tlhide" style="width:22px;height:22px"' + (S.tlHide ? ' checked' : '') + '> <b>Hide years</b></label></div>';
    h += '<div class="tl">';
    REVIEW.timeline.forEach(function (e, i) {
      if (sel.indexOf(e.cat) < 0) return;
      h += '<div class="ev c-' + e.cat + (S.tlHide ? ' hide' : '') + '" id="ev' + i + '"><button data-act="tlopen" data-i="' + i + '"><div class="y">' + esc(e.y) + '</div><b>' + esc(e.t) + '</b> ' + he('<span class="small muted">' + esc(e.he) + '</span>') + '<div class="d">' + fmt(e.d) + '</div></button></div>';
    });
    return h + '</div>';
  }

  /* ---------- key terms ---------- */
  function vTerms() {
    var h = dayTabs(REVIEW, 'terms') + '<h2 style="margin:0 2px 8px">Key terms</h2><input type="search" id="termQ" placeholder="Search (Hebrew or English)" autocomplete="off"><div class="card" id="termList" style="margin-top:12px">' + termRows('') + '</div>';
    return h;
  }
  function termRows(q) {
    q = q.trim().toLowerCase();
    var rows = deckFor('all').concat(EXTRA.reduce(function (a, d) { return a.concat(deckFor(d.id)); }, [])).filter(function (c) { return !q || c.f.toLowerCase().indexOf(q) >= 0 || c.b.toLowerCase().indexOf(q) >= 0; });
    if (!rows.length) return '<div class="empty">No match.</div>';
    return rows.map(function (c) { return '<div class="term-row"><div class="spread"><b class="rtl" dir="rtl" lang="he">' + esc(c.f) + '</b><span class="chip">' + esc(c.d.label) + '</span></div><div class="small">' + fmt(c.b) + '</div></div>'; }).join('');
  }

  /* ---------- zmrt guide ---------- */
  function vZmrt() {
    var z = DATA.zmrt;
    var h = '<h2 style="margin:0 2px 6px">' + esc(z.title) + '</h2><p style="margin:0 2px 12px">' + fmt(z.intro) + '</p>';
    h += '<div class="card"><h3>For <bdi class="he" dir="rtl">הצג</bdi>: <bdi class="he" dir="rtl">זמר"ת</bdi></h3>';
    z.letters.forEach(function (l) { h += '<div class="letter"><div class="L">' + esc(l[0]) + '</div><div><b class="he" lang="he">' + esc(l[1]) + '</b><div class="small">' + fmt(l[2]) + '</div></div></div>'; });
    h += '<p class="small" style="margin:10px 0 0">Then <b><bdi class="he" dir="rtl">הסבר</bdi></b>: explain why it happened / what it caused, and connect it back to the exact wording of the question.</p></div>';
    h += '<div class="card"><h3>Question verbs</h3>';
    z.verbs.forEach(function (v) { h += '<div class="term-row"><b class="rtl" dir="rtl" lang="he" style="display:block">' + esc(v[0]) + '</b><div class="small">' + fmt(v[1]) + '</div></div>'; });
    h += '</div><div class="card"><h3>Worked example</h3>' + he('<b>' + esc(z.example.q) + '</b>') + '<div class="answer rtl" dir="rtl" lang="he">' + paras(z.example.a) + '</div></div>';
    h += '<div class="card"><h3>Tips</h3><ul class="facts">' + z.tips.map(function (t) { return '<li>' + fmt(t) + '</li>'; }).join('') + '</ul></div>';
    return h;
  }
  function vNotFound() { return '<div class="card empty">Page not found. <a href="#home">Go home</a></div>'; }

  /* ======================= ROUTER ======================= */
  var TITLES = { home: 'History Bagrut', quiz: 'Quick quiz', cards: 'Flashcards', weak: 'Weak spots', zmrt: 'How to answer', timeline: 'Timeline', terms: 'Key terms' };
  function render() {
    var h = (location.hash || '#home').slice(1).split(/--|\//);
    var v = h[0] || 'home', a = h[1], b = h[2], html = '', title = TITLES[v] || 'History Bagrut', parent = '#home';
    app._test = null;
    if (v === 'day' && dayById(a)) { html = vDay(dayById(a)); title = dayById(a).label + ' · ' + dayById(a).dayName; }
    else if (v === 'topic') { html = vTopic(a); if (TOPIC[a]) { title = TOPIC[a].day.label + ' · Topic'; parent = '#day--' + TOPIC[a].day.id; } }
    else if (v === 'test') { html = vTest(a, b); title = 'Bagrut practice'; if (dayById(a)) parent = '#day--' + a; else if (a === 't' && TOPIC[b]) parent = '#topic--' + b; else if (a === 'random') parent = '#day--d5'; else parent = '#weak'; }
    else if (v === 'cards') { html = vCards(a); if (a) parent = a === 'all' ? '#cards' : '#day--' + a; }
    else if (v === 'quiz') { html = vQuiz(a); if (a) parent = a === 'all' ? '#day--d5' : (dayById(a) ? '#day--' + a : '#quiz'); }
    else if (v === 'weak') html = vWeak();
    else if (v === 'zmrt') html = vZmrt();
    else if (v === 'timeline') { html = vTimeline(); parent = '#day--d5'; }
    else if (v === 'terms') { html = vTerms(); parent = '#day--d5'; }
    else if (v === 'home') html = vHome();
    else html = vNotFound();
    app.innerHTML = html;
    document.getElementById('title').textContent = title;
    var bb = document.getElementById('backBtn'); bb.hidden = v === 'home'; bb.dataset.to = parent;
    var nav = { home: 'home', day: 'home', topic: 'home', test: 'home', quiz: 'quiz', cards: 'cards', weak: 'weak', zmrt: 'zmrt', timeline: 'home', terms: 'home' }[v] || 'home';
    Array.prototype.forEach.call(document.querySelectorAll('.nav a'), function (x) { x.classList.toggle('on', x.dataset.n === nav); });
    if (render._last !== location.hash) window.scrollTo(0, 0);
    render._last = location.hash;
    var tq = document.getElementById('termQ');
    if (tq) tq.addEventListener('input', function () { document.getElementById('termList').innerHTML = termRows(tq.value); });
  }

  /* ======================= EVENTS ======================= */
  function armed(el, msg) {
    if (el.dataset.armed) return true;
    el.dataset.armed = '1'; var old = el.textContent; el.textContent = msg; el.classList.add('bad');
    setTimeout(function () { if (el.isConnected) { delete el.dataset.armed; el.textContent = old; if (!/resetAll/.test(el.dataset.act)) el.classList.remove('bad'); } }, 4000);
    return false;
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.dataset.act, id = el.dataset.q;
    if (act === 'back') { location.hash = el.dataset.to || '#home'; return; }
    if (act === 'theme') { S.theme = { auto: 'dark', dark: 'light', light: 'auto' }[S.theme] || 'auto'; applyPrefs(); save(); toast('Theme: ' + S.theme); if (location.hash === '' || location.hash === '#home') render(); return; }
    if (act === 'size') { S.size = { '0': 1, '1': 2, '2': -1, '-1': 0 }[String(S.size)]; applyPrefs(); save(); toast('Text size ' + ({ '-1': 'small', '0': 'normal', '1': 'large', '2': 'extra large' })[String(S.size)]); return; }
    if (act === 'resetAll') { if (armed(el, 'Tap again to delete everything')) { localStorage.removeItem(KEY); S = load(); UI = {}; FC = null; QZ = null; applyPrefs(); render(); toast('Progress reset'); } return; }
    if (act === 'showTest') { UI['t:' + el.dataset.t] = true; render(); return; }
    if (act === 'check') { UI[id] = { open: true, ticks: QBY[id].q.keys.map(function () { return false; }) }; save(); refreshQ(id); return; }
    if (act === 'score') {
      var q = QBY[id].q, u = UI[id], n = u.ticks.filter(Boolean).length;
      var got = Math.round(q.pts * n / q.keys.length), pct = Math.round(100 * n / q.keys.length);
      var prev = S.bq[id];
      S.bq[id] = { got: got, pct: pct, best: Math.max(got, prev ? prev.best : 0), n: (prev ? prev.n : 0) + 1, ticks: u.ticks.slice(), t: Date.now() };
      u.ticks.forEach(function (t, i) { if (!t) S.miss[id + '#' + i] = (S.miss[id + '#' + i] || 0) + 1; });
      u.scored = { got: got, pct: pct }; save(); refreshQ(id); return;
    }
    if (act === 'retry') { UI[id] = { open: false }; refreshQ(id); var ta = document.querySelector('[data-draft="' + id + '"]'); if (ta) ta.focus(); return; }
    if (act === 'clearTest') {
      var T = testList(el.dataset.w, el.dataset.a);
      if (T && armed(el, 'Tap again to clear this test')) { T.list.forEach(function (q) { delete S.bq[q.id]; delete S.drafts[q.id]; delete UI[q.id]; }); save(); render(); toast('Test cleared'); }
      return;
    }
    if (act === 'newMock') { newRandomMock(); S.rmock.forEach(function (x) { delete UI[x]; }); render(); toast('New random mock'); return; }
    if (act === 'flip') { FC.flip = !FC.flip; el.classList.toggle('flip', FC.flip); return; }
    if (act === 'gotit' || act === 'again') {
      var c = FC.queue.shift();
      if (act === 'gotit') S.flash[c.k] = true; else { delete S.flash[c.k]; FC.queue.push(c); }
      FC.flip = false; save(); render(); return;
    }
    if (act === 'cardsAll') { startCards(FC.id, true); render(); return; }
    if (act === 'cardsReset') { FC.deck.forEach(function (c) { delete S.flash[c.k]; }); save(); startCards(FC.id, true); render(); return; }
    if (act === 'qsel') { var d = el.dataset.d, s = S.quizSel || [], i = s.indexOf(d); if (i >= 0) s.splice(i, 1); else s.push(d); S.quizSel = s; save(); render(); return; }
    if (act === 'qstart') { var key = NONREV.map(function (x) { return x.id; }).filter(function (x) { return S.quizSel.indexOf(x) >= 0; }).join('-'); QZ = null; location.hash = '#quiz--' + key; return; }
    if (act === 'pick') {
      var it = QZ.items[QZ.i]; if (it.picked !== undefined) return;
      it.picked = +el.dataset.o; it.right = it.picked === it.q.a; if (it.right) QZ.score++;
      if (QZ.i === QZ.items.length - 1) { S.quiz.push({ days: QZ.ids.map(function (x) { return dayById(x).label; }).join(' + '), s: QZ.score, n: QZ.items.length, t: Date.now() }); if (S.quiz.length > 30) S.quiz.shift(); save(); }
      render(); return;
    }
    if (act === 'next') { QZ.i++; render(); return; }
    if (act === 'quizAgain') { startQuiz(QZ.key, QZ.ids); render(); return; }
    if (act === 'tlcat') { var cs = S.tlCats || CATS.map(function (c) { return c[0]; }), j = cs.indexOf(el.dataset.c); if (j >= 0) cs.splice(j, 1); else cs.push(el.dataset.c); S.tlCats = cs; save(); render(); return; }
    if (act === 'tlopen') { el.parentNode.classList.toggle('open'); return; }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.act === 'learn') { if (t.checked) S.learned[t.dataset.t] = true; else delete S.learned[t.dataset.t]; save(); toast(t.checked ? 'Marked as learned' : 'Unmarked'); return; }
    if (t.dataset.act === 'tlhide') { S.tlHide = t.checked; save(); render(); return; }
    if (t.dataset.key) {
      var u = UI[t.dataset.key]; if (!u) return;
      u.ticks[+t.dataset.i] = t.checked; t.closest('label').classList.toggle('on', t.checked);
    }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.draft) { S.drafts[t.dataset.draft] = t.value; saveSoon(); }
  });
  window.addEventListener('hashchange', render);
  window.addEventListener('pagehide', save);
  applyPrefs();
  render();
})();
</script>
</body>
</html>
