<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>History Bagrut Prep</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --card2:#f0ede6; --text:#1f2328; --muted:#5f6670;
  --border:#e2ded5; --accent:#2f6f73; --accent-soft:#dcebea; --accent-text:#ffffff;
  --ok:#2e7d4f; --ok-soft:#dff1e5; --bad:#b4483b; --bad-soft:#f8e1dd; --warn:#a86b12; --warn-soft:#f8ecd5;
  --src:#fbf6e9; --src-border:#e4d4a8; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --fs:18px; --radius:16px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew","Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#16191d; --card:#1f2328; --card2:#272c32; --text:#e8e6e1; --muted:#a2a8b0;
  --border:#343a42; --accent:#6fb3b0; --accent-soft:#24393a; --accent-text:#0f1416;
  --ok:#6cc08d; --ok-soft:#1f3527; --bad:#e58a7d; --bad-soft:#3d2421; --warn:#e0b161; --warn-soft:#3b301c;
  --src:#2a2619; --src-border:#5a4d2a; --shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16191d; --card:#1f2328; --card2:#272c32; --text:#e8e6e1; --muted:#a2a8b0;
    --border:#343a42; --accent:#6fb3b0; --accent-soft:#24393a; --accent-text:#0f1416;
    --ok:#6cc08d; --ok-soft:#1f3527; --bad:#e58a7d; --bad-soft:#3d2421; --warn:#e0b161; --warn-soft:#3b301c;
    --src:#2a2619; --src-border:#5a4d2a; --shadow:none; color-scheme:dark;
  }
}
:root[data-size="1"]{--fs:20px} :root[data-size="2"]{--fs:22px} :root[data-size="-1"]{--fs:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.he{font-family:var(--font)}
bdi.he{unicode-bidi:isolate}
.rtl{direction:rtl;text-align:right}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.top h1{font-size:1.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--border);background:var(--card);border-radius:12px;min-width:44px;height:44px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px}
.iconbtn svg{width:22px;height:22px}
main{max-width:760px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.68em;padding:4px 2px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center}
.nav a svg{width:24px;height:24px}
.nav a.on{color:var(--accent);font-weight:600}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 6px;line-height:1.3}
h2{font-size:1.25em} h3{font-size:1.08em}
.muted{color:var(--muted)} .small{font-size:.85em} .tiny{font-size:.75em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--card);cursor:pointer;text-decoration:none;color:var(--text);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.78em;font-weight:600;
  background:var(--card2);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
button.chip{cursor:pointer;min-height:38px;font-size:.85em}
button.chip.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* ---------- home ---------- */
.hero{padding:6px 2px 14px}
.hero .big{font-size:1.5em;font-weight:700;line-height:1.25;margin:0}
.daycard{display:block;text-decoration:none;color:inherit;position:relative}
.daycard.today{border:2px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.daycard .num{font-size:.8em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.daycard .ttl{font-size:1.08em;font-weight:700;margin:2px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card2);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:1.05em}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tool{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;min-height:88px;box-shadow:var(--shadow)}
.tool b{font-size:.98em}
.tool span{font-size:.8em;color:var(--muted)}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--text);border:1px solid var(--border);background:var(--card);
  padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9em;min-height:42px;display:inline-flex;align-items:center}
.tabs a.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
/* ---------- topics ---------- */
.tlist a{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:12px 0;border-bottom:1px solid var(--border)}
.tlist a:last-child{border-bottom:0}
.tick{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.8em}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* lessons */
.lesson p{margin:0 0 14px;line-height:1.7}
.remember{background:var(--ok-soft);border-radius:12px;padding:12px 14px;margin:12px 0}
.examtip{background:var(--warn-soft);border-radius:12px;padding:12px 14px;margin:12px 0}
.remember b{color:var(--ok)} .examtip b{color:var(--warn)}
.remember ul,.examtip ul{margin:6px 0 0;padding-left:20px} .remember li,.examtip li{margin:0 0 6px}
/* booklet pairs */
.pair{border-bottom:1px solid var(--border);padding:12px 0}
.pair:last-child{border-bottom:0}
.he-line{font-size:1.02em;line-height:1.75;margin-bottom:6px}
.en-line{color:var(--muted);font-size:.9em;border-left:3px solid var(--accent-soft);padding-left:10px}
.main-idea{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-weight:600}
.facts{padding-left:20px;margin:10px 0}
.facts li{margin:0 0 10px}
.learned{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card2);cursor:pointer;user-select:none;min-height:52px}
.learned input{width:24px;height:24px;accent-color:var(--ok)}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.9em}
.note b{color:var(--warn)}
.reveal{margin-top:10px}
.answer{border-radius:12px;background:var(--ok-soft);padding:12px 14px;margin-top:10px}
.answer p{margin:0 0 8px} .answer p:last-child{margin:0}
/* ---------- bagrut ---------- */
.qtag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qtext{font-weight:700;white-space:pre-line;margin:6px 0 10px;font-size:1.04em}
.src{background:var(--src);border:1px solid var(--src-border);border-radius:12px;padding:12px 14px;margin:6px 0 10px;white-space:pre-line;font-size:.95em}
.src cite{display:block;font-style:normal;color:var(--muted);font-size:.85em;margin-top:6px}
textarea{width:100%;min-height:170px;border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:12px;line-height:1.6;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.model{background:var(--card2);border-radius:12px;padding:12px 14px;margin:12px 0}
.model p{margin:0 0 10px} .model p:last-child{margin:0}
.keys{list-style:none;margin:8px 0;padding:0}
.keys li{margin:0 0 8px}
.keys label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:12px;cursor:pointer;background:var(--card)}
.keys label.on{border-color:var(--ok);background:var(--ok-soft)}
.keys input{width:22px;height:22px;flex:0 0 22px;margin-top:3px;accent-color:var(--ok)}
.kind{font-size:.72em;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.kind.k-הסבר{background:var(--warn-soft);color:var(--warn)}
.kind.k-מקור{background:var(--src);color:var(--warn);border:1px solid var(--src-border)}
.kind.k-השוואה{background:var(--ok-soft);color:var(--ok)}
.result{border-radius:12px;padding:12px 14px;margin-top:10px;font-weight:700}
.result.good{background:var(--ok-soft);color:var(--ok)} .result.mid{background:var(--warn-soft);color:var(--warn)} .result.low{background:var(--bad-soft);color:var(--bad)}
.zmrt-mini{display:flex;gap:6px;flex-wrap:wrap;direction:rtl}
.zmrt-mini span{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:4px 10px;font-weight:700;font-size:.85em}
.letter{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.letter:last-child{border:0}
.letter .L{flex:0 0 52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-text);font-size:1.6em;font-weight:800;display:flex;align-items:center;justify-content:center}
details{border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--card)}
details summary{cursor:pointer;font-weight:700;min-height:28px}
/* ---------- flashcards ---------- */
.flash{perspective:1200px;margin:6px 0 14px}
.flash .inner{position:relative;min-height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--border);
  background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.flash .front .term{font-size:1.6em;font-weight:800;line-height:1.3}
.flash .back{transform:rotateY(180deg);background:var(--accent-soft)}
.flash .back div{font-size:1.02em}
@media (prefers-reduced-motion: reduce){.flash .inner{transition:none}}
/* ---------- quiz ---------- */
.opt{display:block;width:100%;text-align:right;direction:rtl;padding:14px 16px;margin:0 0 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);cursor:pointer;min-height:54px;font-weight:600}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
/* ---------- timeline ---------- */
.tl{position:relative;margin-left:8px;padding-left:22px;border-left:3px solid var(--border)}
.tl .ev{position:relative;margin:0 0 12px}
.tl .ev::before{content:"";position:absolute;left:-31px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--c,var(--accent));border:3px solid var(--bg)}
.tl .ev button{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.tl .y{font-weight:800;color:var(--c,var(--accent));font-size:.9em}
.tl .hide .y{filter:blur(7px)}
.tl .hide.open .y{filter:none}
.tl .d{display:none;margin-top:6px;font-size:.92em}
.tl .open .d{display:block}
.c-bg{--c:#7a6fa8} .c-nazi{--c:#b4483b} .c-war{--c:#5a6b7d} .c-final{--c:#7d4a3a} .c-coping{--c:#2e7d4f} .c-yishuv{--c:#2f6f73}
:root[data-theme="dark"] .c-bg{--c:#a99de0} :root[data-theme="dark"] .c-nazi{--c:#e58a7d} :root[data-theme="dark"] .c-war{--c:#9fb0c2} :root[data-theme="dark"] .c-final{--c:#d79a85} :root[data-theme="dark"] .c-coping{--c:#6cc08d} :root[data-theme="dark"] .c-yishuv{--c:#6fb3b0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-bg{--c:#a99de0} :root:not([data-theme="light"]) .c-nazi{--c:#e58a7d} :root:not([data-theme="light"]) .c-war{--c:#9fb0c2} :root:not([data-theme="light"]) .c-final{--c:#d79a85} :root:not([data-theme="light"]) .c-coping{--c:#6cc08d} :root:not([data-theme="light"]) .c-yishuv{--c:#6fb3b0}}
input[type=search]{width:100%;min-height:48px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:10px 14px}
.term-row{padding:10px 0;border-bottom:1px solid var(--border)}
.term-row:last-child{border:0}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.sticky-total{position:sticky;top:66px;z-index:5}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="backBtn" aria-label="Back" data-act="back" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 id="title">History Bagrut</h1>
  <button class="iconbtn" data-act="size" aria-label="Text size"><b style="font-size:.85em">A<span style="font-size:1.25em">A</span></b></button>
  <button class="iconbtn" data-act="theme" aria-label="Dark mode">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<main id="app"></main>
<nav class="nav" id="nav">
  <a href="#home" data-n="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
  <a href="#quiz" data-n="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></svg>Quiz</a>
  <a href="#cards" data-n="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Cards</a>
  <a href="#weak" data-n="weak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>Weak spots</a>
  <a href="#zmrt" data-n="zmrt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>זמר"ת</a>
</nav>
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   ALL STUDY CONTENT LIVES IN THIS ONE OBJECT. EDIT FREELY.
   ---------------------------------------------------------------------
   Formatting inside strings:
     {עברית}   -> shown as a Hebrew term (kept in the right direction)
     **bold**  -> bold
     \n        -> new paragraph (in model answers / source texts)
   Topic:     { id, title, he, main, facts:[...], note?, test:{q,a} }
   Flashcard: [ 'Hebrew term (front)', 'explanation (back)' ]
   Quiz:      { q, o:[4 options], a: index of correct option, ex }
   Bagrut:    { id, topic, pts, tag, src?:{text,cite}, q, model,
                keys:[ ['הצגה'|'הסבר'|'השוואה'|'מקור', 'key point'] ] }
   Note:      { teacher:'her version', other:'common version' }
   ===================================================================== */
const DATA = {
  testDay: 'Thursday',

  zmrt: {
    title: 'How to answer a Bagrut question',
    intro: 'Every Bagrut question has a **verb**. The verb tells you what to write. Most questions are {הצג} + {הסבר}: first present the facts, then explain and connect back to the question.',
    letters: [
      ['ז', 'זמן', 'When? Year, date, period. ("ב-1 באפריל 1933...")'],
      ['מ', 'מקום', 'Where? Country, city, ghetto, camp. ("...ברחבי גרמניה...")'],
      ['ר', 'רקע', 'Background: what led to it, who was involved. ("לאחר עליית הנאצים לשלטון...")'],
      ['ת', 'תיאור', 'Description: what actually happened, 2-3 facts. ("אנשי ס"א עמדו בפתחי החנויות...")']
    ],
    verbs: [
      ['הצג / תאר', 'Present the event with {זמר"ת}. Facts only, but full facts.'],
      ['הסבר', 'Give the reason / meaning / effect. Use words like: {משום ש...}, {לכן...}, {כתוצאה מכך...}, {בכך...}. Then connect back to the wording of the question.'],
      ['ציין', 'Name it briefly (one line each). No long explanation needed.'],
      ['השווה', 'Pick the categories ({תחומים}) first, e.g. who, when, goal, result. For each one write: {ב...} X, {לעומת זאת ב...} Y. Say what is {דומה} and what is {שונה} if asked.'],
      ['הדגם', 'Give a concrete example (name, place, date) that shows the idea.'],
      ['קטע מקור', 'Quote or point to the words in the source ({"כפי שנאמר בקטע: ..."}), then add knowledge from class that is NOT in the source.']
    ],
    example: {
      q: 'הצג את יום החרם הכלכלי, והסבר את מטרתו.',

        items: [
          [`גרמניה הופכת לטוטליטרית: 1. מפלגה 2. מנהיג 3. טרור 4. חינוך ותעמולה 5. מדיניות כלכלית 6. שליטה על אמצעי נשק.`, `**The booklet's 6 features of the Nazi regime.** Learn the list by heart: party, leader, terror, education and propaganda, economy, control of weapons.`],
          [`① מפלגה אחת – המפלגה הנאצית: למחרת מינוי היטלר לקנצלר הוא הכריז שוב על בחירות כדי לזכות ברוב גדול יותר. תוך כדי מערכת הבחירות הס"א (הצבא של המפלגה הנאצית) הפעיל אלימות נגד כל המתנגדים לו ובמיוחד נגד הקומוניסטים.`, `The day after he became chancellor Hitler called new elections to win a bigger majority. During the campaign the {ס"א} (SA, the Nazi party's army) used violence against all opponents, especially communists.`],
          [`שבוע לפני הבחירות ב-1933 עלה באש בניין הפרלמנט. הנאצים אמרו שהקומוניסטים ביצעו את השריפה ובתגובה אסרו חברי מפלגה רבים. למרות האווירה הקשה במדינה הנאצים קיבלו רק 44% אחוז תמיכה בבחירות.`, `A week before the 1933 elections the parliament building (the Reichstag) burned. The Nazis blamed the communists and arrested many party members. Even so, the Nazis got only **44%**.`],
          [`במרץ חוקק הפרלמנט הגרמני את **חוק ההסמכה** שאמר שהממשלה יכולה לחוקק חוקים בלי אישור הפרלמנט – מאז היטלר חוקק חוקים כרצונו.`, `**The Enabling Act** {חוק ההסמכה} (March 1933): the government may pass laws without parliament. From then on Hitler made any law he wanted.`],
          [`ב-1933 חוקק היטלר את **החוק להגנת אחדות המפלגה והרייך** שאסר על פעילות של מפלגות שהם לא המפלגה הנאצית. ב-1933 היו בחירות חדשות לפרלמנט והפעם היה בהם רק מפלגה אחת – המפלגה הנאצית והיא זכתה ב-95% מהקולות ובכל המושבים בפרלמנט.`, `**The Law for the Protection of the Unity of Party and Reich** banned every party except the Nazi party. In new 1933 elections only the Nazis ran: **95%** and every seat.`],
          [`היטלר ידע שבגרמניה יש חשיבות גדולה לחוק ולסדר, ולכן דאג שכל הפעולות הקיצוניות שלו יהיו לפי החוק, וכך מרבית הגרמנים קיבלו את פעולותיו לחלוטין.`, `Hitler knew Germans care about law and order, so he made every extreme step **legal**. That is why most Germans accepted it.`],
          [`② מנהיג אחד – עקרון המנהיג ופולחן אישיותו: היטלר קבע שמנהיג אחד צריך להוביל את המדינה בכל התחומים. לכן היו מעט ישיבות ממשלה. ב-1933 הכריז על **אחדות המפלגה והמדינה** – כלומר מנהיג המפלגה הוא מנהיג המדינה והוא בעל כל הסמכויות. ב-1934 הפך היטלר להיות גם נשיא המדינה.`, `**One leader:** one man leads the state in every field, so the cabinet rarely met. 1933: **unity of party and state** – the party leader is the state leader with all powers. 1934: Hitler also became president.`],
          [`כדי לחזק ולבסס את שלטונו עשה היטלר **האחדה – נאציפיקציה** כלומר יצירת זהות בין המדינה למפלגה וערכיה. כל מוסדות הציבור, מוסדות המדינה, האוניברסיטאות, המשטרה ועוד הפכו להיות נאצים מבחינת בעלי התפקידים והערכים. תהליך זה ביטא את השקפת היטלר: **עם אחד, מדינה אחת, מנהיג אחד!**`, `{האחדה – נאציפיקציה} = making the state identical to the party: every public body, university and the police got Nazi staff and Nazi values. Slogan: **"One people, one state, one leader!"** ({עם אחד, מדינה אחת, מנהיג אחד})`],
          [`בנוסף, היה בגרמניה **פולחן אישיות** של היטלר. היטלר היה כריזמטי ונאומיו היו סוחפים מאוד וגרמו לציבור לחשוב שהוא גאון שלעולם לא טועה. הוא היה נותן הנחיות לא ברורות וכל הפקידים לו ניסו להתחרות ביניהם על ההבנה הנכונה של המנהיג – כך ברח היטלר מאחריות על הפעולות של המשטר שלא הצליחו.`, `**Personality cult** {פולחן אישיות}: Hitler was charismatic; people thought he was a genius who never makes mistakes. He gave vague orders, so officials competed to guess what he wanted, and he escaped blame for failures.`],
          [`יום הולדתו היה יום חג בגרמניה. הוא תואר כארי פשוט אוהב מוזיקה וילדים. בעיני הגרמנים נחשב כמעט כמו אלוהים. אזרחי גרמניה הערצו אותו וקראו לו "מיין פיהרר" (המנהיג שלי). אנשים סיימו שיחות במילים "הייל היטלר" והצדיעו במועל יד. שיא של פולחן האישיות היה באספות המונים.`, `His birthday was a holiday; he was shown as a simple Aryan who loves music and children, almost a god. People called him "Mein Führer" and ended conversations with "Heil Hitler" and a raised arm. The peak: **mass rallies** with music, drums and symbols.`]

        items: [

          [`א. ב-1933 בשבוע הראשון לשלטונו הוא הקים את **מחנה הריכוז הראשון דכאו** שיועד למתנגדי השלטון והיה צריך לחנך אותם מחדש באמצעות "העבודה משחררת". בהתחלה נעצרו שם פעילים קומוניסטים אח"כ גם אנשי דת, הומוסקסואלים ואלכוהוליסטים ולבסוף גם אסירים יהודים.`, `**Dachau** {דכאו}, the first concentration camp, opened in the **first week** of Nazi rule (1933) for opponents, to "re-educate" them through labor ("work sets you free"). First communists, then clergy, homosexuals, alcoholics, and finally Jews.`],
          [`דכאו היה דוגמא שלפיו הוקמו מחנות ריכוז נוספים. במחנה היו מדים מספרים ומספר אסיר וכן שיטות ענישה קשות כולל עונשים גופניים והרעבה. מי ששוחרר מדכאו היה כל כך שבור שלא העז להתנגד שוב לשלטון. דכאו היה מחנה אימון לס"ס שאח"כ היו אחראים על מחנות ההשמדה.`, `Dachau was the model for other camps: uniforms, prisoner numbers, beatings and starvation. Released prisoners were too broken to oppose again. It was a **training camp for the SS**, who later ran the death camps.`],
          [`במחנה דכאו מתו עשרות אלפי אסירים. כשאסיר נפטר שרפו את גופתו ושלחו למשפחתו על מנת להפחיד. כרבע מיליון גרמנים היו במחנות הריכוז בין 1933-1939.`, `Tens of thousands died in Dachau; bodies were burned and the ashes sent to families to frighten them. Many Germans passed through the camps in 1933-1939.`],
          [`ב. **"ליל הסכינים הארוכות"** – בלילה זה נערכה מתקפה מתוכננת של אנשי הס"ס על הס"א שהואשמו בניסיון למרוד בהיטלר. בלילה זה בעצם חוסל הס"א. מתקפה זו הבהירה לעם הגרמני מה יקרה למי שינסה להתנגד אפילו במעט להיטלר.`, `**Night of the Long Knives** {ליל הסכינים הארוכות} (1934): the SS attacked the SA, accused of plotting a revolt. The SA was destroyed that night. Message to Germans: anyone who opposes Hitler even a little will be crushed.`],
          [`ג. לאחר מכן הוקמו יחידות נוספות בתוך הס"ס כמו יחידת המודיעין – הס"ד שבדקה את טוהר הגזע, **הגסטאפו** – המשטרה החשאית הגרמנית שעודדה הלשנה על חברים שכנים ובני משפחה.`, `More SS units: the {ס"ד} (intelligence, checked "racial purity") and the **Gestapo** {הגסטאפו}, the secret state police, which encouraged people to inform on friends, neighbors and family.`]

          [`סדר העדיפויות החינוכי של היטלר: 1. בניית הגוף באמצעות פעילות ספורט רבה. 2. הקניית תכונות כמו אומץ לב ואכזריות. 3. עולם רוח כולל את האידיאולוגיה הנאצית. 4. לימודים והשכלה נוספים.`, `**Hitler's order of priorities:** (1) building the body with lots of sport; (2) traits like courage and cruelty; (3) spirit, including Nazi ideology; (4) only last, academic study.`],
          [`היטלר ראה בילדים חיילים לעתיד. הנאצים הקימו **בתי ספר יוקרתיים** בהם לימדו משמעת וסדר. בכל בתי הספר הודגשה חשיבות המדינה, ערכי הנאציזם, וערך הציות להיטלר. כל הילדים חויבו להשתתף בפעילות של **תנועת הנוער – ההיטלר יוגנד**. מערכת החינוך חנכה את הנערים להגן על גרמניה ואת הנערות לשמור על המשפחה וללדת ילדים ארים רבים ובריאים.`, `Children = future soldiers. Elite schools for discipline; obedience to Hitler everywhere. **Every child had to join the Hitler Youth** {ההיטלר יוגנד}. Boys were raised to defend Germany, girls to keep the family and have many healthy Aryan children.`],
          [`גם **האוניברסיטאות** העבירו מסרים דומים. מ-1933 היה גם **חוק הפקידות** שאסר על יהודים לעבוד באוניברסיטאות. כל אנשי הסגל של האוניברסיטה היו נאצים ומי שלא נשבע להיטלר ולמפלגה פוטר ממשרתו ונרדף על ידי הגסטאפו. חומר הלימודים שונה ברוח האידיאולוגיה (כלכלה גרמנית, ביולוגיה גרמנית).`, `**Universities:** the 1933 Civil Service Law banned Jews; staff who didn't swear loyalty to Hitler were fired and hunted by the Gestapo; subjects were rewritten ("German economics", "German biology").`],
          [`**תרבות ואומנות** – הוקמה "לשכת הרייך לתרבות" ובתוכה היו מחלקות לכל האמנויות. היוצרים היו צריכים להישבע אמונים להיטלר ולציית, ואם לא גורשו או נלקחו למחנה ריכוז. ב-1933 יזמה אגודת הסטודנטים **שריפת ספרים** – מיליוני ספרים של סופרים יהודים וקומוניסטים נשרפו.`, `**Culture:** the "Reich Chamber of Culture"; artists had to swear loyalty or be exiled / sent to a camp. 1933: students organized the **book burning** {שריפת ספרים} of Jewish and communist authors.`],
          [`**תעמולה** – היטלר ראה חשיבות גדולה לתעמולה ולכן הקים את "משרד התעמולה" ובראשו **גבלס**. המסרים: היטלר הוא שליח ההשגחה העליונה לגאול את גרמניה; הגזע הארי הוא הגזע העליון; היהודים הם מקור הרוע והחולשה ולכן יש לפגוע בהם בכל דרך. שיטות: עצרות המוניות, עיתונות, רדיו וקולנוע. לדוגמה חולק מקלט רדיו בחינם להמונים אך היה בו רק ערוץ אחד ששידר רק את הנאומים של היטלר.`, `**Propaganda:** the Propaganda Ministry headed by **Goebbels** {גבלס}. Messages: Hitler was sent by Providence to save Germany; the Aryan race is supreme; Jews are the source of evil. Means: mass rallies, press, radio, cinema – e.g. **free radios with only one channel** broadcasting Hitler's speeches.`]

        main: 'Hitler centralized the economy with the Four-Year Plan (jobs for 6 million unemployed, then preparation for war) and made every armed force – police, SS, army – personally loyal to him.',

          [`היטלר אסר על איגודים מקצועיים (התארגנות של ועדי עובדים כדי לפעול להגן על זכויות העובדים) למעט האיגוד הנאצי. בוטלה זכות השביתה.`, `Trade unions banned (except the Nazi union); the right to strike abolished.`],

          [`**1940 – ביבשת אירופה – כיבוש דנמרק, נורבגיה, הולנד, בלגיה, צרפת**: ב-1940 – בשנה אחת כבשו הגרמנים את דנמרק, נורבגיה, הולנד ובלגיה כמעט ללא מאמץ, בהפתעה ובמלחמת בזק מהירה בלי להתחשב בגורל האזרחים שבאזורי הקרבות. כיבוש בלגיה גזר את גורלה של צרפת.`, `**1940**: Denmark, Norway, Holland, Belgium – almost without effort, by Blitzkrieg. Taking Belgium sealed France's fate.`],
          [`**צרפת** סמכה על קו הגנה מבוצר בגבולה עם גרמניה – **קו מז'ינו (חומה בצורה)**, אך לאחר שכבשו הגרמנים את בלגיה, קו מאז'ינו כבר לא הגן על צרפת והם פלשו לצרפת דרך בלגיה. צרפת לא התכוננה כראוי למלחמה, כי העדיפה להאמין בשלום ולהתעלם מהתכוונות של היטלר. בריטניה שלחה חיילים לסייע לצרפת אך לא הצליחה לעזור. בריטניה רק הצליחה לבצע את **"מבצע דנקירק"** – מבצע חילוץ של 350,000 חיילים בריטים וצרפתים שלא היו להם סיכוי מול צבא גרמניה. הצבא הגרמני הגיע עד לפאריז.`, `France relied on the **Maginot Line** {קו מז'ינו}, but the Germans went around it **through Belgium**. France wasn't prepared (preferred to believe in peace). Britain could only carry out **Dunkirk** – evacuating **350,000** British and French soldiers. The Germans reached Paris.`],
          [`ראש הממשלה החדש של צרפת המרשל פטן שהיה גיבור מלחמת העולם הראשונה חתם על הסכם שביתת נשק עם הגרמנים. **תוכן ההסכם**: צפון ומערב צרפת יעבור לידי גרמניה, ובדרום צרפת הוקמה מדינת חסות שבירתה היא העיר **וישי**. **ממשלת וישי** (הצרפתית-הנאצית) שיתפה פעולה עם גרמניה באופן מלא עד סוף המלחמה.`, `Marshal **Pétain** signed an armistice: north and west France to Germany; in the south a protectorate with its capital at **Vichy** – the **Vichy government** {ממשלת וישי} cooperated fully with Germany.`],
          [`הגנרל הצרפתי **"שארל דה גול"** נמלט לבריטניה וקרא לכל חייל צרפתי להצטרף אליו למלחמה נגד הגרמנים בטענה שממשלת וישי אינה מייצגת את הלאום הצרפתי והוא ממשיך להילחם בגרמניה. בערך 300,000 חיילים הצטרפו. **(תוך שנה, גרמניה שולטת כמעט בכל מרכז ומערב אירופה מלבד בריטניה, היחידה שהחזיקה מעמד ולא נכבשה על ידה).**`, `**Charles de Gaulle** fled to Britain and kept fighting (~300,000 French soldiers joined). **Within a year Germany ruled almost all of central and western Europe – except Britain.**`]

          [`הפלישה לרוסיה ב-1941 כונתה "מבצע ברברוסה". **כאן החל לראשונה רצח המוני וישיר של יהודים ("הפתרון הסופי"), בעיקר על ידי ירי בבורות.**`, `**Here the mass, direct murder of Jews began** ("the Final Solution"), mainly by shooting at pits.`],

        main: 'After Wannsee: Operation Reinhard built Bełżec, Sobibor and Treblinka; Auschwitz-Birkenau used Zyklon B; Eichmann ran the deportations; in camps like Auschwitz Mengele carried out selections.',

          [`**א. הקמת מחנות השמדה – תאי גזים**: אחרי ועידת ואנזה החל **"מבצע ריינהרד"** (על שם היידריך ריינהרד, שנרצח ע"י המחתרת הצ'כית) בו הוקמו (אביב וקיץ 1942) שלושה מחנות השמדה: **בלז'ץ, סוביבור וטרבלינקה**. במחנות אלו נבנו תאי גזים שנועדו להשמדה המונית של יהודי הגנרלגוברנמן.`, `**Operation Reinhard** (named for Heydrich, killed by the Czech underground), spring-summer 1942: **Bełżec, Sobibor, Treblinka** – gas chambers for the Jews of the General Government.`],
          [`ביוני 1942 הוקם ליד מחנה אושוויץ 1, מחנה ההשמדה הגדול ביותר- **אושוויץ בירקנאו**. במחנה זה השתמשו בגז **ציקלון B** שהיה יעיל יותר מהגז בו השתמשו עד אז. מספר הנרצחים במחנה זה היה הגדול ביותר ונרצחו בו למעלה **ממיליון ורבע** יהודים. מחנה השמדה נוסף- **מיידנק** (סה"כ 6 מחנות השמדה בפולין). רוב הנרצחים במחנות ההשמדה היו יהודים אך היו ביניהם גם צוענים שנרצחו בכל רחבי אירופה.`, `**June 1942: Auschwitz-Birkenau**, the largest; **Zyklon B**; over **1.25 million** Jews murdered. Also **Majdanek**. **6 death camps in Poland** in total (Chełmno, Bełżec, Sobibor, Treblinka, Auschwitz-Birkenau, Majdanek). Roma were murdered too.`],
          [`**ב. אקציות- שילוחים למחנות**: הגרמנים הקימו גם מנגנון לגירוש היהודים למחנות ההשמדה. המנגנון איתר את היהודים, הביא אותם לנקודות איסוף, הוביל אותם ברכבות לפולין ואז "טיפל" כלומר השתלט על הרכוש שלהם. בראש המנגנון עמד **אדולף אייכמן**.`, `**Deportation machinery** headed by **Adolf Eichmann**: locate, gather, send by train to Poland, take the property.`],

        items: [
          [`מטרת הגרמנים הייתה השמדה של היהודים אך הנאצים רצו גם לדכא את רוחם ולהשפיל את היהודים. הגרמנים מנעו מהיהודים את תנאי החיים הבסיסיים, הרסו משפחות והשפילו את הזהות היהודית. לכן תגובת היהודים הייתה מלחמה לא רק על עצם החיים (הניסיון לשרוד את המלחמה) אלא גם על משמעות החיים וצלם האנוש.`, `The Nazis wanted to destroy the Jews **and** crush their spirit. So the Jews fought for **life itself** and also for **the meaning of life and צלם אנוש** (human dignity).`],

          [`**הרב חיים ניסנבוים (גטו ורשה) ורוב הפוסקים** הכריעו שתקופת השואה היא לא שעת שמד אלא להפך- כי לראשונה האויב הנאצי רודף את היהודי לא בגלל קיום מצוות התורה אלא כי רוצה להשמיד את הגוף היהודי ועל כן עליו לשמור על חייו **ולעשות הכל כדי לשרוד ולהמשיך לחיות!** "זו שעה של **קידוש החיים** ולא של **קידוש השם** במוות. לפנים דרשו אויבים את הנשמה והיהודי הקריב את גופו. עתה הצורר דורש את גופו וחובה על היהודי להגן עליו: לשמור את חייו" (הרב ניסנבוים). → קידוש החיים כלומר, לעשות כל שאפשר כדי לשמור על החיים וגם לשמור על האנושיות!`, `**Rabbi Nissenbaum** (Warsaw ghetto) and most poskim: **not** a time of shmad – the enemy wants the **body**, so the Jew must guard his life. "This is an hour of Kiddush HaChaim, not Kiddush Hashem by death. Once enemies demanded the soul and the Jew sacrificed his body. Now the oppressor demands the body, and the Jew must defend it: guard his life."`],
          [`**שתי משמעויות לקידוש החיים**: 1. **קידוש עצם החיים**- האיבערלייבן (= המאבק לשרוד)- מלחמה והגנה על החיים ככל האפשר, וניסיון להציל את חיי וחיי אחרים כמה שיותר (לדוגמה: הברחות מזון, הסתתרות בבתי גויים ומנזרים, התחזות לגויים, בריחה ליערות ועוד). 2. **קידוש של דרך החיים**- שמירה על צלם אנוש- להמשיך להיות אנושי, אדם ערכי ומוסרי, שמירה על כבוד האדם, עזרה לזולת, חיים בעלי משמעות, כולל משמעות דתית ע"י קיום תורה ומצוות. כל זאת במציאות לא אנושית (לדוגמה: הקמת בתי יתומים ובתי תמחוי, שמירת אורח חיים יהודי).`, `**Two meanings – memorize:** (1) **sanctifying life itself** – "איבערלייבן" (Yiddish: surviving) – e.g. smuggling food, hiding with non-Jews or in monasteries, posing as non-Jews, fleeing to forests; (2) **sanctifying the way of life** – keeping **צלם אנוש**: moral, helping others, meaningful and religious life – e.g. orphanages, soup kitchens, Jewish life.`],

          [`עם פלישת הנאצים לפולין ברחו רבים ממנהיגי הקהילות כי חשבו שהגרמנים יפגעו קודם במנהיגים. כתוצאה מכך נשארו קהילות רבות ללא מנהיג בתקופה קשה זו.`, `Many community leaders fled when Poland was invaded (they thought leaders would be hit first), so many communities were left without leadership.`],
          [`הפקודה להקמת היודנראט נמצאת במסמך החשוב **אגרת הבזק**, שהתפרסם עם כיבוש פולין. היודנרט הוקם בפקודת הגרמנים אך נבחר לרוב גם באמצעות בני הקהילה כך שהתפקיד הפך להנהגה של ממש ליהודי הגטו. היודנראט משמעו **מועצת זקנים יהודית** כלומר הנהגת היהודים- אלו שניהלו בפועל את הגטאות. **מטרתו של היודנראט- מנגנון ההוצאה לפועל של הוראות הגרמנים והגורם המקשר בין היהודים לשלטונות.**`, `Ordered by the **Schnellbrief**; set up by German order but usually chosen by the community too, so it became **real leadership**. {מועצת זקנים יהודית}. **Purpose: the machinery that carries out German orders + the link between Jews and the authorities.**`],
          [`(דף העבודה בחוברת) **שני תפקידים של היודנראט כלפי השלטון הנאצי**: 1. ביצוע הוראות הגרמנים – למשל אספקת עובדים לעבודות כפייה. 2. גביית רכוש/מסים, אכיפת סימון היהודים, ובהמשך הכנת רשימות לשילוח. **שני תפקידים כלפי תושבי הגטו היהודים**: 1. אספקת מזון ודיור. 2. בריאות, סעד, חינוך ותרבות (למשל תשלום לאמנים).`, `**Worksheet answer:** toward the Nazis – supply forced labor, collect property, enforce the badge, later deportation lists. Toward residents – food and housing, health, welfare, education, culture.`],
          [`היודנרט השתנה לעיתים קרובות על ידי הגרמנים שהרחיקו ראשי יודנראט שהיו עצמאיים מדי ומינו כאלו צייתנים. ראשי היודנרט כמעט ולא יכלו להתייעץ או להעביר מידע עם קהילות אחרות ופעלו כל אחד על פי הבנתו. חוסר המידע וההטעיה של הגרמנים יצר בלבול רב.`, `The Germans often replaced leaders who were too independent with obedient ones. Leaders couldn't consult other communities; lack of information and German deception caused great confusion.`],
          [`**עם הקמת הגטו, הדילמה הראשונה של היודנראט- האם לקבל את המינוי לתפקיד או לא!** בעצם קיומו של היודנראט קיים מתח גדול בין הצורך להקשיב לגרמנים ולמלא את תפקידם הרשמי לבין הרצון לשמור על היהודים ועל החיים בגטו מבחינה פיזית ורוחנית. המתח יוצר דילמות שונות בתפקידים השונים.`, `**First dilemma: accept the appointment or not?** Built-in tension: obey the Germans vs protect the Jews physically and spiritually.`],
          [`**דילמת קבלת המינוי**: היודנרטים מונו עוד לפני הקמת הגטו ועמדו בפני חוסר ידיעה מה ידרשו מהם הנאצים ומה מטרותיהם. הם עמדו בפני דילמה האם לקבל את המינוי או לא. הגרמנים העדיפו שההנהגה תהיה מקובלת על היהודים ולכן לפעמים הקהילה בחרה את היודנרטים אך כשהבחירה לא תאמה למטרה של הנאצים הם בחרו את הנציגים גם אם לא מתאימים. **המניעים לקבלת התפקיד**: היו יודנרטים שרצו את התפקיד כדי לעזור לקהילה וכאלו שרצו כבוד שלטון וטובות הנאה. היו כאלה שסרבו לקבל את המינוי או שקיבלו אותו מתוך תחושת אחריות.`, `**Motives for accepting:** to help the community; or honor, power and benefits; some refused, some accepted out of responsibility.`],
          [`**ההבדלים בין דרכי ההתנהגות של ראשי יודנראטים שמונו סמוך לכיבוש פולין (המינוי היה הגל הראשון) ובין ראשי יודנראטים שמונו לאחר סילוק ראשי היודנראטים הראשונים (גל שני)**: **בגל הראשון**: סולקו יותר ראשי יודנרטים על רקע אי מילוי הוראות... ראשי היודנרטים בגל הראשון הרגישו מחויבות גבוהה יותר לציבור היהודי (ואכן אנו יודעים כי בשלב הראשון העדיפו הגרמנים שההנהגה תהיה מקובלת על הציבור היהודי) לדוג': היודנרט סייעו לבני הקהילה, סירבו למלא גזירות כלכליות, הזהירו מפני אקציות קרבות, סירבו למסור יהודים לידי הנאצים, היו שוויתרו על התפקיד בגלל אי השלמה עם מדיניות הנאצים.`, `**First wave** (appointed right after the conquest): more committed to the Jews – helped, refused economic decrees, **warned of coming aktions**, refused to hand Jews over, some resigned; many were removed for not obeying.`],
          [`**בגל השני**: כאשר המינוי פגע במטרת הגרמנים להגיע לשיתוף פעולה מלא בביצוע הוראותיהם, הם מינו באופן שרירותי נציגים שלא היו מתאימים להנהגה, מינו אנשים שרצו בשררה ובכבוד או אנשים שניצלו את מציאות החיים בגטו לקידום ענייניהם האישיים. חברי יודנראט רבים מהגל השני, שיתפו פעולה עם הוראות הנאצים, ויחד עם זאת חלקם המשיכו לסייע לבני קהילותיהם אך באופן מועט יחסי לתקופת הגל הראשון של מינוי היודנראט.`, `**Second wave:** the Germans appointed arbitrary, unsuitable people who wanted power or personal gain; many cooperated fully; some still helped, but less.`],
          [`**היחס של ראשי היודנראט למרד ולארגוני המחתרות בגטאות היתה זהה בשני הגלים משום**: רוב היהודים התקשו להאמין שהגרמנים משמידים את הציבור היהודי והאמינו שיוכלו לשרוד את המלחמה וחששו שהמרד יפגע בסיכויי ההישרדות. לכן, גם ראשי יודנראטים שהיו מחויבים לציבור היהודי האמינו שהמרד אינו תואם את מטרות היהודים.`, `**Same in both waves – against revolt:** most Jews couldn't believe the Germans were exterminating them, hoped to survive, and feared revolt would ruin their chances.`],
          [`**התמודדות היודנראט עם מצוקת היהודים בגטו עד לגירוש למחנות השמדה**: בתקופה זו התלבטו ראשי היודנראט איך למצוא מקום בין שיתוף פעולה לבין שמירה על קיום הגטו. למשל- הגרמנים דרשו לספק להם עובדים לעבודות כפיה- האם לציית להם? האם לשלוח אנשים שלא יחזרו?! ואם כן איך לבחור את העובדים- בצורה שוויונית או לפי הכוח שלהם הפיזי? האם להשתמש בכסף לטובת הכלל? האם לאפשר לעשירים לשלם תמורת חייהם? האם לאפשר הברחת מזון לגטו? לשאלות לא הייתה תשובה אחידה, וראשי היודנראט סבלו מביקורת רבה.`, `**Daily dilemmas:** obey the forced-labor demand? Send people who won't return? Choose workers equally or by strength? Let the rich pay for their lives? Allow food smuggling? No single answer; much criticism.`],
          [`(שאלה מהחוברת, עמ' 51, עם תשובה) **מדוע מינו הנאצים יודנראטים לאחר כיבוש פולין?** "על מנת לקבל סיוע בהוצאות לפועל של הוראות הנאצים, וכך יחסכו בכוח אדם גרמני. כמו כן, הגרמנים רצו להימנע ממגע עם היהודים, ולתת תחושה ליהודים שהם מנהלים את עצמם (אוטונומיה יהודית)."`, `**Why the Nazis set up Judenrats (booklet answer):** help carry out orders and **save German manpower**; **avoid contact** with Jews; give Jews a feeling of **self-rule (autonomy)**.`]
        ],
        test: { q: 'מה ההבדל בין ראשי היודנראט בגל הראשון לבין הגל השני?', a: 'בגל הראשון, שמונו סמוך לכיבוש פולין, ראשי היודנראט הרגישו מחויבות גבוהה יותר לציבור: סייעו, סירבו לגזירות, הזהירו מפני אקציות, סירבו למסור יהודים, ורבים מהם סולקו. בגל השני מינו הגרמנים באופן שרירותי אנשים שרצו שררה או טובות הנאה, ורבים שיתפו פעולה; חלקם סייעו, אך פחות.' }

        main: 'Czerniaków eased life in the Warsaw ghetto at first, and when deportations to the death camps began he refused to cooperate and took his own life.',
        items: [
          [`לפני המלחמה, אדם צ'רניאקוב היה סגן ראש הקהילה בוורשה, ראש הקהילה ברח מוורשה ועל כן הגרמנים הטילו עליו להיות ראש היודנרט בוורשה ולמנות עוד 24 חברים ביודנרט.`, `Deputy head of the Warsaw community before the war; the head fled, so the Germans made Czerniaków head of the Judenrat and told him to appoint **24 more members**.`],
          [`**צ'רניאקוב בתחילת תק' הגטו, לפני השילוחים**: הוא ניסה להקל על תושבי הגטו- הקים מערכת עזרה בגטו. הוא אפשר להבריח מזון לגטו מה שעזר לרעב הקשה. הוא ניסה למנוע ככל הניתן את ההתערבות של הגרמנים בענייני הגטו.`, `**Before the deportations (1939-1941):** built an aid system, **allowed food smuggling**, tried to keep the Germans out of ghetto affairs.`],
          [`**צרניאקוב בתקופת השילוחים למחנות ההשמדה**: כשהחלו הגירושים למחנה השמדה צרניאקוב לא הסכים לשתף פעולה עם הנאצים ולתת אנשים למשלוחים ולכן החליט לשים קץ לחייו והתאבד. (קראי את קטע המקור בעמוד 151)`, `**During the deportations (1942):** he **refused to cooperate** and give people for the transports, and **took his own life**.`],
          [`**דילמת המשלוחים למחנות השמדה**: הדילמה הקשה ביותר היתה משנת 1942 כשהיודנרטים חויבו לשתף פעולה עם הנאצים בארגון משלוחים למחנות השמדה. בהתחלה לא ידעו לאן המשלוחים, אך גם לשלוח אנשים למקום מרוחק היה דילמה קשה. כשנודע מטרת המשלוח הדילמה החמירה. **הסבר את הדילמה**: לשתף פעולה ולהכין רשימות – ולשלוח יהודים למותם (אולי כדי להציל חלק), או לסרב – ולסכן את עצמך, את משפחתך ואת הגטו, כשהגרמנים יבצעו בעצמם ובאכזריות רבה יותר או ימנו מישהו צייתן.`, `**The hardest dilemma (1942):** take part in organizing the transports? Cooperate and send Jews to death (maybe to save some), or refuse and risk yourself, your family and the ghetto, knowing the Germans will do it more cruelly or appoint someone obedient.`]

          [`האדמו"ר מפיאסצנה היה רבה של העיירה **פיאסצנה** ליד ורשה וראש ישיבה חסידית בוורשה. **נוכח קשיי התקופה (רדיפות ותהיות) הפעולות של האדמו"ר מפיאסצ'נה בגטו ורשה**: בזמן השואה עזב את ביתו ועבר לוורשה להיות ליד תלמידיו ולא ברח גם כשיכל. במשך כל הזמן בגטו עודד את התלמידים – המשיך לקיים את ה"טיש" ונתן דרשות אמוניות מחזקות. הוא ידע שבתוך הרעב והמוות קשה להאמין ודיבר על כך שאלו **ייסורי אמונה**. דרשותיו בגטו נמצאו לאחר השואה והודפסו בספר בשם **"אש קודש"**.`, `Rabbi of the town of **Piaseczno** and head of a Hasidic yeshiva in Warsaw. Moved to Warsaw to be near his students; **didn't flee when he could**; kept the **"tish"**; gave faith-strengthening sermons; spoke of **{ייסורי אמונה}** (sufferings of faith). Sermons found after the war: **"אש קודש"**.`],

  story: [
    `**First, what does "totalitarian" mean?** A {משטר טוטליטרי} is a regime that wants **total** control: not only over the government, but over every part of a person's life – what he reads, what his children learn, what job he has, even what he thinks. The opposite is a **democracy** {דמוקרטיה}, where power is split between the government, the parliament and the courts, there are many parties, and people have rights. The booklet's whole first chapter answers one question: **how did Germany turn from a democracy (the Weimar Republic) into a totalitarian state in about a year and a half?** It gives 6 features. This topic covers the first two.`,
    `**Where we start: January 1933.** Hitler was appointed chancellor ({קנצלר} = head of the government) by President Hindenburg. But being chancellor did not give him total power yet – there was still a parliament (the {רייכסטאג}), other parties, and laws. So the very next day he called **new elections**, hoping to win a big majority that would let him do whatever he wanted.`,
    `**The election campaign was violent.** The {ס"א} (SA, "storm troopers") was the Nazi party's private army of street fighters. During the campaign they beat and threatened opponents, **especially communists**, who were the Nazis' main political rivals.`,
    `**The Reichstag fire.** A week before the election, the parliament building burned. The Nazis immediately said "the communists did it" and arrested many communist party members. (Booklet p.7 adds that in reality SS men set the fire.) The fire gave Hitler an excuse to say Germany was in an emergency. **Even after all this, the Nazis got only 44%** – less than half. This number matters: it shows most Germans did *not* vote for the Nazis, and that Hitler took total power by *other* means, not by winning a majority.`,
    `**The Enabling Act ({חוק ההסמכה}), March 1933** – the most important law of the chapter. "Enabling" = it *enabled* the government to pass laws **without the parliament**. In a democracy laws must be voted on in parliament; after this act Hitler could simply write laws himself. The booklet says it was passed while SA and SS men surrounded and threatened the members of parliament. **From this moment, the booklet says, Germany became totalitarian.** Learn that sentence.`,
    `**Getting rid of all other parties.** Next Hitler passed {החוק להגנת אחדות המפלגה והרייך} – "the Law to Protect the Unity of the Party and the Reich". It banned every party except the Nazi party. ({רייך} = "empire/state" in German, here meaning Germany.) Then he held **new elections with only one party on the ballot** – of course the Nazis "won" **95%** and every seat. So the parliament still existed on paper but was empty of opposition.`,
    `**Why did he bother with laws at all?** This is a favorite idea of the booklet: Hitler knew that **Germans value law and order** ({חוק וסדר}). If he had simply grabbed power by force, many Germans would have objected. Because every extreme step was made "legal", most Germans accepted it. So the legal-looking path was a *strategy*.`,
    `**Feature 2: one leader – {עקרון המנהיג} and the personality cult.** Hitler held that one man should lead the state in every field, so the cabinet (the ministers) hardly ever met – decisions came from him. In 1933 he declared **{אחדות המפלגה והמדינה}** – unity of party and state: the head of the Nazi party *is* the head of the state, with all powers. In 1934, when President Hindenburg died, Hitler also took the president's job – now there was nobody above him at all.`,

    `**The personality cult ({פולחן אישיות}).** "Cult" = worship. Germans were taught to worship Hitler almost like a god: he was a charismatic speaker; people believed he was a genius who never made mistakes; his birthday was a national holiday; he was presented as a simple Aryan who loves music and children. People called him "Mein Führer" (my leader) and ended conversations with "Heil Hitler" and a raised arm. The peak was the **mass rallies** – huge, carefully staged events with marching, drums, music and symbols, where Hitler spoke like a messenger from heaven.`,

    `**1919 – Versailles and Weimar.** Germany lost World War I. The peace treaty, the **Treaty of Versailles** ({חוזה ורסאי}), punished Germany: land taken, a small army only, huge payments. At the same time Germany became a democracy, the **Weimar Republic** ({רפובליקת ויימאר}). Many Germans linked the new democracy with the humiliation, because its leaders signed the treaty.`,
    `**1920-1925 – the party grows.** 1920: Hitler becomes leader of the National Socialist (Nazi) party. 1921: the **SA** is founded – violence against opponents from the start. 1922: Germany's **Jewish foreign minister** (Walther Rathenau) is murdered – a sign of how violent the right-wing antisemitic atmosphere already was. 1923: Hitler tries a **coup** (an armed takeover) – it fails and he goes to prison. 1924: **in prison he writes "Mein Kampf"** ("My Struggle"), laying out his principles and how to achieve them. Lesson he learned: take power **legally**, not by a coup. 1925: the **SS** is founded as Hitler's bodyguard; Hindenburg is elected president.`,

    `**Why did so many Germans welcome the Nazis?** The booklet gives exactly **two reasons**, and they're asked often: (1) **the crisis** – Germany was in deep crisis after WWI, and many hoped the Nazis would pull it out; (2) **national honor** – they hoped the Nazis would restore the honor that was humiliated when the Weimar government signed Versailles. One is economic, one is emotional/national.`,
    `**The timeline on p.11** splits everything into two tracks: **domestic policy** ({מדיניות פנים} – inside Germany: the fire, the Enabling Act, Dachau, one party, the Night of the Long Knives) and **foreign policy** ({מדיניות חוץ} – outside: leaving the League of Nations, pacts, annexing Austria and the Sudetenland, invading Poland). Good to know the difference between the two words.`
  ],

    `**Race theory ({תורת הגזע}) – the central principle.** The Nazis claimed humanity is divided into **races**, and three things are true about them: (1) races are **inborn** ({מולדים}) – you're born into one; (2) they are **ranked** ({מדרג}) – some are worth more than others; (3) they **can't change** – "if you're Aryan you can't become Slavic", and a Jew can't stop being a Jew. This third point is what made Nazi antisemitism so deadly: no conversion, no assimilation could save anyone.`,

    `**Volk ({פולק}) = "people/nation" in German.** In Nazi ideology the **nation is the supreme value** ({ערך עליון}), and the individual must sacrifice himself for it. Compare with democracy, where the individual's rights come first. In Nazism the individual counts only as part of the Volk.`,

    `**The book burning ({שריפת הספרים}), May 1933.** Books by **Jewish writers and thinkers and by opponents of Nazism** were burned in central squares across Germany. The biggest was at **Opera Square in Berlin – about 20,000 books**. The booklet quotes **Heinrich Heine**, a great German poet who was a converted Jew, who wrote in **1820**: **"במקום שבו שורפים ספרים, ישרפו גם בני אדם"** – "where they burn books, they will also burn people." It's quoted because it came true. Later, performing music and plays by Jews was banned too.`

    `**What is a ghetto?** {גטו} = a neighborhood or street where Jews are **closed in and separated** from the rest of the city. The booklet says it's a **"fluid" concept** – each ghetto was different. Usually it was set up in the **poorest part of the city**, without proper conditions. Some ghettos were **closed by a wall**; others had openings, so Jews could go out to work and come back at night. The biggest was the **Warsaw ghetto**, with about **half a million Jews** – far more than it could hold.`,
    `**Why ghettos? The Germans' 5 goals (memorize – very common):** (1) **concentrate** the Jews near railway lines; (2) **isolation and extermination**: cram many Jews into a small place so diseases will spread and bring a **slow, "natural" extermination** – death from **typhus** – **without effort** by the Germans; (3) **control and supervision** – the Germans can control everything the Jews do; (4) **exploit the Jews' labor for profit**; (5) **deception** – give the Jews an **illusion of autonomy** ({אשליה של אוטונומיה} = self-rule), because the Judenrat seemed to run the ghetto. The booklet adds a separate goal on p.31 – **economic exploitation** (6.4).`,
    `**Where?** On the map (booklet p.98) the ghettos are mainly **in Poland – about a thousand ghettos** – and almost none in Germany. Why? The Germans **didn't want to "defile" German soil with Jews**, so they put the ghettos as far away as possible, mainly in **central Poland, in the General Government**.`,
    `**Hardships in the ghetto (3):** (1) **hunger and poverty** – the Germans controlled the food so the Jews would die a slow death; (2) **crowding and terrible sanitation** – too many people in too small a space → severe diseases, and **no medicine**; (3) **no heating** – Polish winters are freezing. All of this came from the **total dependence** the Germans created; the isolation was complete. The result: **one fifth** of the population of the Warsaw and Łódź ghettos died. So the ghettos were already a form of murder, even before the death camps.`
  ],
  remember: [
    `Ghetto = closed Jewish area, poorest neighborhood; Warsaw ~½ million.`,
    `5 goals: concentration near railways, slow extermination, control, labor, illusion of autonomy.`,
    `~1,000 ghettos, mainly in the General Government (not on German soil).`,
    `Hunger, crowding/disease, no heating → ⅕ of Warsaw and Łódź died.`
  ],
  exam: [
    `Booklet p.32 Q4 (hardships), Q6 (economic + social interest of the Germans in ghettos).`
  ]
};

    `**The women ({הנשים בגטו}).** The historian of the Warsaw ghetto, **Emanuel Ringelblum** (who also ran the secret "Oneg Shabbat" archive), wrote that the future historian will have to **dedicate a page to the Jewish woman in the war** – thanks to her **courage and endurance**, thousands of families got through the terror. Why was her role so big? Because in most families the **father was gone** – usually taken to forced labor (6.2). So the mother had to: (1) **do hard work for many hours**; (2) **take care of the children**; (3) **provide for the family**. The booklet's summary: she carried the housework, the children, the income and the food **alone, with no help from anyone**.`,

LESSONS['c7-t1'] = {
  story: [
    `**What is "the Final Solution"?** {הפתרון הסופי} was the Nazis' code name for the "solution to the Jewish question" – the plan to **murder all the Jews**. Until 1941 the policy was isolation and concentration (Germany: pushing Jews out; Poland: ghettos). From **June 1941** it became **direct mass murder**. The booklet's box lists the stages: Barbarossa and the pits → the Einsatzgruppen → death camps → Wannsee → aktions and deportations → extermination and selections → liquidating camps and death marches → North Africa.`,
    `**Why did the mass murder start with the invasion of the USSR? (3 reasons – very common question)** (1) **Ideological struggle** ({מאבק אידיאולוגי}): communism and Nazism were opposite, hostile ideologies. Communism was based on the writings of **Karl Marx, who was Jewish**, so the Nazis saw communism as Jewish – the war against communism was a war against the Jews. (2) **Many Jews + living space**: the Nazis wanted to empty huge Soviet territories for Aryan settlers, and with the conquest **about 2 million more Jews** fell into their hands; they looked for a "solution" other than the ghettos they had used in Poland. (3) **The Nazis' feeling**: they felt **invincible** and believed they could do anything to the Jews – so the invasion was especially barbaric and cruel.`,
    `**The Commissar Order ({פקודת הקומיסרים}), June 1941.** A week **before** the invasion, German forces got an order: **every active member of the communist party is to be killed without trial**. ("Commissar" = a communist political officer.) Since in the Nazis' eyes **Jew = communist**, this order **allowed them to kill Jews** too. It's the legal-looking "permission" for mass murder.`,
    `**The Einsatzgruppen ({איינזצגרופן} – "operational units").** To carry out the order, **four special SS units** were formed. Their job: **organized, systematic, intentional mass murder** of "ideological enemies" – and **especially the Jews**. **Local people** – Lithuanians, Ukrainians – also carried out pogroms, encouraged by the Germans, and collaborators were allowed to **loot the victims' property**.`,
    `**How the murder was done (the "shooting pits", {בורות ירי}).** It was organized and orderly – that's what makes it so horrifying. When an area was conquered, an **order was posted**: Jews must report "for transfer to a labor camp", and anyone who didn't come would be killed. The Jews were led **outside the town**, ordered to **dig a pit** and **undress**, then **shot** so they fell into the pit. About **1.5 million Jews** were murdered this way (e.g. Ponar near Vilna, Babi Yar near Kiev).`,
    `**Why the Nazis changed method – the 4 disadvantages (memorize):** (1) **expensive** – a bullet or more per person wasted ammunition needed for the war; (2) **slow** – shooting one by one; (3) **hard to hide** – the shots were heard far away; (4) **psychological** – a "dirty" method: the killers saw their victims die in front of them and didn't always cope – they **drank a lot, went wild, and some didn't return to the army after home leave**. Notice the Nazis' "problem" was the effect on the *murderers*, not pity for the victims. **So they moved to the next method** – gas.`
  ],
  remember: [
    `3 reasons: Jewish communism (Marx), many Jews + living space, feeling invincible.`,
    `Commissar Order (June 1941): kill communists without trial → Jew = communist.`,
    `4 Einsatzgruppen; locals helped; ~1.5 million in shooting pits.`,
    `Disadvantages: expensive, slow, hard to hide, psychological.`
  ],
  exam: [
    `Booklet p.38 Q1 (the method, its problems, the "improvement" = gas), p.40 Q9-10 (Einsatzgruppen role; reason).`
  ]
};

LESSONS['c7-t2'] = {
  story: [
    `**Chełmno ({חלמנו}) – the first death camp, December 1941.** The Nazis switched to **gas in special camps**. At Chełmno in Poland they used **gas vans** ({משאיות גז}): ordinary trucks filled with Jews, with the **exhaust pipe turned inside**. The truck drove while the Jews suffocated, then went to the burial place. With **3 vans they murdered 300,000 Jews**. But this was **still relatively slow** – there wasn't much room in a van. (The slides add: only ~70 people per van, and breakdowns.)`,
    `**A death camp ({מחנה השמדה}) vs a concentration camp ({מחנה ריכוז}).** Make sure you know the difference: a concentration/labor camp (like Dachau) was for **imprisonment and forced labor** – many died, but killing wasn't the purpose. A death camp was a **factory for murder** – most people were killed within hours of arriving.`,
    `**The Wannsee Conference ({ועידת ואנזה}), 20 January 1942.** About a month and a half after Chełmno opened, representatives of **all the Nazi government ministries** met at a villa in **Wannsee, Berlin**. Important: they were from the **operational level** ({הדרג המבצע} – the people who carry things out), **not the decision level** ({הדרג המחליט}). The chairman was **Reinhard Heydrich**, head of the SS Security Service, because the SS had the central role. The booklet adds that **Himmler**, commander of the SS, was "the commander of the extermination" (it doesn't say he was in the room – he wasn't). It was decided that the **SS would have the central role**.`,
    `**The most misunderstood point:** Wannsee **did not decide whether to murder the Jews** – **that was already decided before**. It dealt with a **systematic plan** and **coordination** between all arms of the government. **Two goals:** (א) **to coordinate** ({לתאם}) how all the different bodies of the Nazi state would act regarding the Final Solution (railways, police, foreign ministry, etc.); (ב) **to make it efficient** ({לייעל}) – with **gas chambers**. That's exactly why only operational people attended.`,
    `**Total.** At Wannsee they decided on a **total** Final Solution – **all Jews of Europe, Asia and North Africa** – and presented a list of **11 million Jews** to be murdered (the protocol was written by **Adolf Eichmann**).`,
    `**The source question the booklet flags as important (source p.109):** "How can you see from the list that the Nazis planned to kill **all** the Jews?" Answer: (1) the list includes **countries not yet conquered** (England 330,000, neutral Sweden, Switzerland, Spain...) and (2) **countries with very few Jews** (e.g. Estonia is listed as "judenfrei" – already "clean of Jews"). If you plan to murder the Jews of countries you don't even rule, and you count tiny communities, your aim is **every single Jew**.`
  ],
  remember: [

    `Source tip: unconquered countries + countries with few Jews → aim = every Jew.`

LESSONS['c7-t3'] = {
  story: [
    `**(א) Building the death camps – gas chambers.** After Wannsee, **Operation Reinhard** ({מבצע ריינהרד}) began – named after **Reinhard Heydrich**, who was killed by the **Czech underground** in 1942. In spring and summer 1942 it set up **three death camps: Bełżec, Sobibor and Treblinka**, with **gas chambers** ({תאי גזים}) for the mass murder of the Jews of the **General Government**.`,
    `**Auschwitz-Birkenau.** In **June 1942**, next to the Auschwitz I camp, the **largest** death camp was set up: **Auschwitz-Birkenau**. There they used **Zyklon B** gas, **more efficient** than the gas used before (engine exhaust). The most people were murdered there – **over a million and a quarter Jews**. Another death camp: **Majdanek**. In total: **6 death camps, all in Poland** – Chełmno, Bełżec, Sobibor, Treblinka, Auschwitz-Birkenau, Majdanek. Most victims were Jews, but **Roma (Gypsies)** from all over Europe were also murdered there.`,
    `**(ב) Aktions and deportations ({אקציות, שילוחים}).** The Germans built a **deportation machine**: find the Jews, bring them to **gathering points**, send them **by train to Poland**, and "handle" them – meaning take over their property. At the head was **Adolf Eichmann** ({אדולף אייכמן}).`,
    `**East vs. West – an important difference.** **Eastern Europe:** the Jews were already in ghettos and were taken in an **aktion** ({אקציה} = "operation"): a **violent, sudden** roundup and deportation. **Western Europe:** deportations "to the East" began; there the Germans **didn't want to arouse suspicion**, so Jews received **orders to report for work or for "resettlement in the East"**. Either way, aktions tore families apart randomly, and the Jews were sent in **sealed freight cars**, crushed together, without air, bread or water. When the train arrived, **many were already dead**.`,
    `**Two kinds of camps.** Some were **only for murder** – like **Treblinka**, where the whole transport went to its death immediately. Others, like **Auschwitz**, were **both labor and extermination camps**.`,
    `**The murder process.** The Germans told the Jews to undress "**for a shower**". Men and women were shaved and run naked into the gas chambers. The chambers were sealed and the gas poured in. Within about **half an hour** all were dead, in agony. Then other prisoners were forced to search the bodies for valuables and **pull out gold teeth**; the bodies went to the **crematoria** and the smoke rose to the sky. The whole process took **about one to two hours**. The victims' property went to **Germany's economy and to funding the Final Solution** – the victims paid for their own murder.`,
    `**Selection ({סלקציה} = sorting).** In camps like Auschwitz, as people got off the train, **Josef Mengele** (an SS doctor) decided with **a wave of his stick** who goes to death and who to life. The **old, the sick, mothers of small children and children** were sent to death. The separation of families was cruel; some families **chose to go together to the end**.`,
    `**"Extermination through work" ({השמדה באמצעות עבודה}).** The few sent "to life" were kept alive **temporarily** to help the German war machine. They worked under humiliation, torture, hunger and beatings until they were **replaced** by stronger workers from a new transport. They got a prisoner number – **only in Auschwitz was it tattooed on the left arm** – and from then on they were just labor until they collapsed.`
  ],
  remember: [
    `Reinhard (spring-summer 1942): Bełżec, Sobibor, Treblinka. Auschwitz-Birkenau (June 1942): Zyklon B, 1.25 million+. Majdanek. 6 camps in Poland.`,
    `Eichmann ran deportations. East = aktion; West = "work/resettlement" orders.`,
    `Treblinka = murder only; Auschwitz = labor + murder. "Shower", ~½ hour, 1-2 hours total.`,
    `Selection by Mengele; extermination through work; tattoo only in Auschwitz.`
  ],
  exam: [
    `Definitions are often asked (p.40 מושגים): אקציה, סלקציה, מבצע ריינהרד, ועידת ואנזה, פקודת הקומיסרים.`

LESSONS['c7-t4'] = {
  story: [
    `**Liquidating the ghettos ({חיסול הגטאות}), 1942-1943.** The deportations to the death camps **emptied the ghettos one by one**. The Germans used a cruel trick: they created a **feeling of calm** so Jews would believe they would live; then, when there was "room" in a death camp, they marked a ghetto for liquidation and **within a few days emptied it completely**. Some ghettos lasted longer because they were **useful** to the Germans: **Łódź** ran many factories for the German war effort, so it survived almost to the end and was **the last ghetto liquidated – August 1944**. Some ghettos were turned into labor camps with only "essential" workers left. By the end, **no trace of the ghettos** remained; a few survivors were scattered in labor and death camps.`,
    `**The death marches ({צעדות המוות}), summer 1944 – May 1945 – "the last stage of the Final Solution".** As the Allies (the USA and the USSR) advanced and beat the Germans, the Germans began to **liquidate and evacuate the death camps to hide the evidence**, and took the prisoners with them **from Poland to camps inside Germany**.`,
    `**Why are they "a stage of the Final Solution"?** In **November 1944 the gas chambers stopped working** – but the **murder continued through the marches**, even though the Germans knew they were losing. Prisoners were marched for **weeks**, thousands of kilometers, **without food, water or proper clothes**, in winter. **Anyone who fell was shot by the road.** Out of about **700,000 prisoners** still alive in all the camps, **more than a third died** on these marches – **200,000-250,000 Jews**.`,
    `**The Germans' 3 reasons/goals (booklet):** (1) a **last chance to kill Jews – and cheaply**; (2) **moving the prisoners to Germany to hide the evidence** of the horrors in the camps; (3) using Jewish prisoners as a **bargaining chip** in surrender negotiations with the Allies, and to **exchange them for captured German soldiers**.`,

    `**The parallel timeline (p.39): war → Jews.** 1939 invasion of Poland → ghettos; 1941 Barbarossa → shooting pits; 1942 Wannsee → death camps; 1943 Soviet victory at Stalingrad → the Germans start retreating; 1944 Nazi losses and the Allied advance → camps evacuated, death marches. This is how to answer "explain how the war influenced the fate of the Jews".`

    `**Why North African Jews suffered at all.** The countries of North Africa were **satellites or protectorates** of European states that were conquered by, or cooperated with, the Nazis. **Morocco, Tunisia and Algeria** were under French rule – the **Vichy government** (French-Nazi, from chapter 5). Libya was under **Italy**.`,
    `**Country by country (learn at least two):** **Morocco** – anti-Jewish regulations that made Jews **lose their jobs**. **Algeria** – under Vichy; the Jews' **French citizenship was revoked**; humiliating antisemitic laws; Jews had to wear a **badge of shame**; **limits on entering schools**. **Libya** (Italy) – racist laws; in **1942 forced-labor camps** where Jews died of exhaustion and disease; about **400 Jews deported to Bergen-Belsen and Innsbruck** in Germany, where they died of hunger and disease. **Tunisia** – **the only one under direct German occupation (1942-1943)**: racist discriminatory laws, Jewish property confiscated, forced-labor camps.`,
