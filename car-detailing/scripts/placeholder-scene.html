<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Placeholder "footage" renderer. NOT part of the website — only used by
// scripts/make-placeholder-footage.mjs to produce demo clips in /footage.
const W = 1920, H = 1080;
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const car = document.createElement('canvas'); car.width = W; car.height = H;
const cc = car.getContext('2d');

// deterministic RNG
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };

const bubbles = Array.from({ length: 1400 }, () => {
  const x = lerp(-650, 650, rnd()), y = lerp(-380, -60, rnd());
  return { x, y, r: lerp(6, 26, rnd() ** 2), th: clamp((y + 380) / 320 * 0.55 + rnd() * 0.45) };
});
const blotches = Array.from({ length: 260 }, () => ({
  x: lerp(-660, 660, rnd()), y: lerp(-300, -40, rnd() ** 0.6), rx: lerp(10, 70, rnd()), ry: lerp(6, 30, rnd()),
  a: lerp(0.15, 0.55, rnd()), rot: rnd() * Math.PI,
}));
const swirls = Array.from({ length: 170 }, () => ({
  x: lerp(-600, 600, rnd()), y: lerp(-340, -110, rnd()), r: lerp(14, 70, rnd()),
  s: rnd() * Math.PI * 2, l: lerp(0.8, 2.4, rnd()),
}));
const drops = Array.from({ length: 260 }, () => ({ x: lerp(-620, 620, rnd()), y: lerp(-360, -120, rnd()), r: lerp(2, 6, rnd()) }));

function bodyPath(g) {
  g.beginPath();
  g.moveTo(-640, -95);
  g.bezierCurveTo(-660, -120, -662, -160, -650, -185);
  g.bezierCurveTo(-640, -215, -610, -228, -560, -234);
  g.lineTo(-390, -246);
  g.bezierCurveTo(-330, -262, -270, -320, -200, -352);
  g.bezierCurveTo(-150, -372, 60, -380, 120, -366);
  g.bezierCurveTo(190, -350, 250, -290, 320, -262);
  g.lineTo(540, -238);
  g.bezierCurveTo(610, -228, 650, -200, 655, -160);
  g.bezierCurveTo(660, -130, 655, -105, 640, -95);
  g.lineTo(520, -95);
  g.arc(390, -105, 130, -0.08, Math.PI + 0.08, true);
  g.lineTo(-260, -95);
  g.arc(-390, -105, 130, -0.08, Math.PI + 0.08, true);
  g.closePath();
}
function glassPath(g) {
  g.beginPath();
  g.moveTo(-330, -252);
  g.bezierCurveTo(-280, -290, -230, -330, -175, -344);
  g.bezierCurveTo(-110, -360, 60, -364, 112, -352);
  g.bezierCurveTo(170, -338, 220, -296, 268, -262);
  g.closePath();
}

function wheel(g, x, dirt, gloss) {
  g.save(); g.translate(x, -105);
  g.fillStyle = '#050506'; g.beginPath(); g.arc(0, 0, 112, 0, 7); g.fill();
  const rim = g.createRadialGradient(-20, -20, 10, 0, 0, 80);
  rim.addColorStop(0, `rgb(${lerp(90, 210, gloss)},${lerp(85, 214, gloss)},${lerp(80, 222, gloss)})`);
  rim.addColorStop(1, '#1b1c20');
  g.fillStyle = rim; g.beginPath(); g.arc(0, 0, 78, 0, 7); g.fill();
  g.fillStyle = '#0b0b0d';
  for (let i = 0; i < 10; i++) { g.save(); g.rotate(i * Math.PI / 5); g.beginPath(); g.ellipse(0, -46, 9, 26, 0, 0, 7); g.fill(); g.restore(); }
  g.fillStyle = '#2a2b30'; g.beginPath(); g.arc(0, 0, 14, 0, 7); g.fill();
  if (dirt > 0) { g.fillStyle = `rgba(78,58,36,${0.5 * dirt})`; g.beginPath(); g.arc(0, 0, 112, 0, 7); g.fill(); }
  g.restore();
}

function render(T) {
  const clip = Math.min(4, Math.floor(T * 5)), p = T * 5 - clip;
  // state
  const foamIn = clip === 1 ? p : clip >= 2 ? 1 : 0;
  const sweep = clip < 2 ? -9999 : clip === 2 ? lerp(-760, 760, smooth(0, 0.55, p)) : 9999;
  const inspect = clip === 2 ? smooth(0.5, 0.65, p) : clip === 3 ? 1 - smooth(0.0, 0.15, p) * 0.4 : 0;
  const lightX = clip === 2 ? lerp(-800, 800, smooth(0.55, 1, p)) : clip === 3 ? lerp(-700, 700, p) : 0;
  const orbX = clip < 3 ? -9999 : clip === 3 ? lerp(-720, 720, smooth(0, 0.7, p)) : 9999;
  const ceramic = clip === 3 ? smooth(0.68, 1, p) : clip === 4 ? 1 : 0;
  const reveal = clip === 4 ? smooth(0, 0.9, p) : 0;
  const gloss = clip < 2 ? 0 : clip === 2 ? 0.25 * smooth(0, 0.55, p) : clip === 3 ? lerp(0.3, 0.75, p) : lerp(0.75, 1, reveal);

  // ---------- car layer (local coords) ----------
  cc.setTransform(1, 0, 0, 1, 0, 0); cc.clearRect(0, 0, W, H);
  const cam = lerp(1.0, 1.08, T) + 0.07 * reveal;
  cc.setTransform(cam, 0, 0, cam, W / 2 + lerp(60, -40, T), H * 0.73);
  // paint
  bodyPath(cc); cc.save(); cc.clip();
  const pg = cc.createLinearGradient(0, -380, 0, -90);
  pg.addColorStop(0, '#5c7fb8'); pg.addColorStop(0.32, '#22396a'); pg.addColorStop(0.55, '#0f1d3c'); pg.addColorStop(1, '#050a16');
  cc.fillStyle = pg; cc.fillRect(-700, -400, 1400, 400);
  // shoulder reflection line
  const sh = cc.createLinearGradient(0, -250, 0, -205);
  sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, `rgba(220,235,255,${0.1 + 0.55 * gloss})`); sh.addColorStop(1, 'rgba(255,255,255,0)');
  cc.fillStyle = sh; cc.fillRect(-700, -250, 1400, 45);
  // door lines
  cc.strokeStyle = 'rgba(0,0,0,.55)'; cc.lineWidth = 3;
  cc.beginPath(); cc.moveTo(-180, -340); cc.lineTo(-200, -105); cc.moveTo(250, -270); cc.lineTo(240, -110); cc.moveTo(30, -360); cc.lineTo(20, -100); cc.stroke();
  // glass
  glassPath(cc); const gg = cc.createLinearGradient(-300, -360, 260, -250);
  gg.addColorStop(0, '#0a0e16'); gg.addColorStop(0.5, `rgba(${lerp(40, 120, gloss)},${lerp(50, 140, gloss)},${lerp(60, 170, gloss)},1)`); gg.addColorStop(1, '#05070c');
  cc.fillStyle = gg; cc.fill();
  cc.fillStyle = '#05070c'; cc.fillRect(-12, -365, 22, 120);
  // dirt (right of rinse sweep)
  cc.save(); cc.beginPath(); cc.rect(Math.max(sweep,-3000), -420, 20000, 500); cc.clip();
  cc.fillStyle = 'rgba(96,82,60,.55)'; cc.fillRect(-700, -400, 1400, 400);
  for (const b of blotches) { cc.fillStyle = `rgba(70,52,30,${b.a})`; cc.beginPath(); cc.ellipse(b.x, b.y, b.rx, b.ry, b.rot, 0, 7); cc.fill(); }
  cc.restore();
  // swirls under inspection light (between rinse and polisher)
  if (inspect > 0) {
    cc.save(); cc.beginPath(); cc.rect(-2000, -420, Math.max(0, Math.min(sweep, orbX) + 2000) , 500); cc.clip();
    for (const s of swirls) {
      if (s.x < orbX) continue;
      const near = Math.exp(-((s.x - lightX) ** 2) / (2 * 220 ** 2));
      cc.strokeStyle = `rgba(235,240,255,${(0.06 + 0.6 * near) * inspect})`; cc.lineWidth = 1.6;
      cc.beginPath(); cc.arc(s.x, s.y, s.r, s.s, s.s + s.l); cc.stroke();
    }
    const lg = cc.createRadialGradient(lightX, -240, 10, lightX, -240, 320);
    lg.addColorStop(0, `rgba(255,250,235,${0.35 * inspect})`); lg.addColorStop(1, 'rgba(255,250,235,0)');
    cc.fillStyle = lg; cc.fillRect(-700, -400, 1400, 400);
    cc.restore();
  }
  // polisher orb
  if (clip === 3 && p < 0.72) {
    const oy = -230 + Math.sin(p * 60) * 50, ox = orbX + Math.cos(p * 60) * 30;
    const og = cc.createRadialGradient(ox, oy, 4, ox, oy, 120);
    og.addColorStop(0, 'rgba(255,255,255,.9)'); og.addColorStop(0.25, 'rgba(255,214,150,.45)'); og.addColorStop(1, 'rgba(255,200,120,0)');
    cc.fillStyle = og; cc.fillRect(ox - 130, oy - 130, 260, 260);
  }
  // ceramic sheen (iridescent sweep)
  if (ceramic > 0 && ceramic < 1) {
    const x = lerp(-900, 900, ceramic);
    const cg = cc.createLinearGradient(x - 220, -400, x + 220, 0);
    cg.addColorStop(0, 'rgba(120,200,255,0)'); cg.addColorStop(0.4, 'rgba(120,200,255,.25)'); cg.addColorStop(0.55, 'rgba(255,180,255,.3)'); cg.addColorStop(0.7, 'rgba(255,240,180,.2)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
    cc.fillStyle = cg; cc.fillRect(-700, -400, 1400, 400);
  }
  // reveal: big specular band
  if (gloss > 0.3) {
    const x = clip === 4 ? lerp(-1100, 1100, smooth(0.05, 0.85, p)) : 400;
    const sg = cc.createLinearGradient(x - 160, -420, x + 160, -60);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, `rgba(255,255,255,${0.55 * gloss})`); sg.addColorStop(1, 'rgba(255,255,255,0)');
    cc.fillStyle = sg; cc.fillRect(-700, -400, 1400, 400);
  }
  // water beads after rinse
  const dropA = clip === 2 ? smooth(0.1, 0.5, p) : clip === 3 ? 1 - smooth(0, 0.5, p) : 0;
  if (dropA > 0) for (const d of drops) if (d.x < sweep) {
    cc.fillStyle = `rgba(210,230,255,${0.55 * dropA})`; cc.beginPath(); cc.arc(d.x, d.y, d.r, 0, 7); cc.fill();
  }
  // foam
  if (foamIn > 0) for (const b of bubbles) {
    if (b.x < sweep || b.th > foamIn * 1.15) continue;
    cc.fillStyle = 'rgba(248,250,255,.93)'; cc.strokeStyle = 'rgba(160,175,200,.6)'; cc.lineWidth = 1.2;
    cc.beginPath(); cc.arc(b.x, b.y, b.r, 0, 7); cc.fill(); cc.stroke();
  }
  cc.restore();
  // lights
  cc.fillStyle = `rgba(255,${lerp(120, 250, reveal)},${lerp(80, 235, reveal)},${0.35 + 0.65 * reveal})`;
  cc.beginPath(); cc.ellipse(612, -195, 32, 12, -0.2, 0, 7); cc.fill();
  cc.fillStyle = `rgba(255,40,40,${0.5 + 0.4 * reveal})`; cc.beginPath(); cc.ellipse(-640, -190, 10, 22, 0, 0, 7); cc.fill();
  // wheels
  const wd = (x) => (x > sweep ? 1 : 0);
  wheel(cc, -390, wd(-390), gloss); wheel(cc, 390, wd(390), gloss);
  // rinse jet
  if (clip === 2 && p < 0.58) {
    const nx = sweep - 160, ny = -560;
    for (let i = 0; i < 40; i++) {
      const tx = sweep + lerp(-60, 60, Math.random()), ty = lerp(-380, -90, i / 40);
      cc.strokeStyle = `rgba(200,225,255,${0.12 + 0.25 * Math.random()})`; cc.lineWidth = 1 + Math.random() * 2;
      cc.beginPath(); cc.moveTo(nx, ny); cc.lineTo(tx, ty); cc.stroke();
    }
    cc.fillStyle = '#9aa0aa'; cc.fillRect(nx - 70, ny - 14, 80, 16);
  }
  // ---------- composite ----------
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const amb = lerp(0.55, 1, smooth(0.4, 1, T));
  const bg = ctx.createRadialGradient(W / 2, H * 0.55, 50, W / 2, H * 0.55, W * 0.75);
  bg.addColorStop(0, `rgb(${32 * amb},${34 * amb},${40 * amb})`); bg.addColorStop(1, '#030304');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // overhead light strips
  for (let i = 0; i < 5; i++) {
    const a = (0.08 + 0.25 * amb) * (clip === 4 ? 1 : 0.7);
    ctx.fillStyle = `rgba(230,238,255,${a})`; ctx.fillRect(W / 2 - 700 + i * 300, 60, 200, 6);
  }
  // floor
  const fl = ctx.createLinearGradient(0, H * 0.73, 0, H);
  fl.addColorStop(0, '#111215'); fl.addColorStop(1, '#020203');
  ctx.fillStyle = fl; ctx.fillRect(0, H * 0.73, W, H);
  // reflection
  ctx.save(); ctx.globalAlpha = 0.06 + 0.22 * gloss; ctx.translate(0, H * 0.73 * 2); ctx.scale(1, -1); ctx.drawImage(car, 0, 0); ctx.restore();
  const fade = ctx.createLinearGradient(0, H * 0.73, 0, H); fade.addColorStop(0, 'rgba(3,3,4,0)'); fade.addColorStop(0.5, 'rgba(3,3,4,.9)'); fade.addColorStop(1, '#030304');
  ctx.fillStyle = fade; ctx.fillRect(0, H * 0.73, W, H);
  // shadow
  const shd = ctx.createRadialGradient(W / 2, H * 0.735, 10, W / 2, H * 0.735, 640);
  shd.addColorStop(0, 'rgba(0,0,0,.8)'); shd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.translate(0, H * 0.735); ctx.scale(1, 0.08); ctx.translate(0, -H * 0.735); ctx.fillStyle = shd; ctx.fillRect(0, 0, W, H * 2); ctx.restore();
  ctx.drawImage(car, 0, 0);
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  return c.toDataURL('image/jpeg', 0.92);
}
window.render = render;
</script></body></html>
